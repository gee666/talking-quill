name: Native packaged smoke gate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  packaged-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
            packageRoot: release/win-unpacked
          - os: windows-11-arm
            target: win
            arch: arm64
            packageRoot: release/win-arm64-unpacked
          - os: macos-15-intel
            target: mac
            arch: x64
            packageRoot: release/mac
          - os: macos-15
            target: mac
            arch: arm64
            packageRoot: release/mac-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            helper/target
          key: rust-packaged-gate-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('helper/Cargo.lock') }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fetch-targets
      - run: node scripts/ensure-cargo-audit.mjs
      - run: pnpm release:audit
      - run: pnpm dead-code
      - run: pnpm notices:check
      - run: pnpm model-manifest:check
      - name: Reusable closed-network and package security policy
        run: pnpm security:gate
      - run: pnpm build
      - name: Build native helper
        run: pnpm build:helper -- --platform ${{ matrix.target }} --arch ${{ matrix.arch }}
      - name: Probe native helper protocol
        run: pnpm test:helper:harness
      - name: Build native unpacked application
        working-directory: app
        run: pnpm exec electron-builder --config ../build/electron-builder.yml --${{ matrix.target }} --${{ matrix.arch }} --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Recursively inspect package
        run: pnpm package:inspect -- ${{ matrix.packageRoot }}
        env:
          TALKING_QUILL_PACKAGE_INSPECTION_STRICT: '1'
          TALKING_QUILL_PACKAGE_ARTIFACTS_REQUIRED: none
          TALKING_QUILL_PACKAGE_TARGET: ${{ matrix.target }}
          TALKING_QUILL_PACKAGE_ARCH: ${{ matrix.arch }}
      - name: Run packaged smoke
        run: pnpm test:packaged
        env:
          TALKING_QUILL_PACKAGE_ROOT: ${{ matrix.packageRoot }}
          TALKING_QUILL_PACKAGE_TARGET: ${{ matrix.target }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
