name: Quality

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            helper/target
          key: rust-quality-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('helper/Cargo.lock') }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fetch-targets
      - run: node scripts/ensure-cargo-audit.mjs
      - run: pnpm release:audit
      - run: pnpm dead-code
      - run: pnpm notices:check
      - run: pnpm model-manifest:check
      - run: pnpm audio-fixture:check
      - name: Closed networking, dependency, and history security policy
        run: pnpm security:gate
      - name: Independent pinned gitleaks full-history scan
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/run-gitleaks.ps1
      - run: pnpm format:check
      - run: cargo fmt --manifest-path helper/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path helper/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path helper/Cargo.toml --locked
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Bounded real development visible-window probe (outside coverage)
        run: pnpm dev:visible-probe
      - name: Provision owned pinned npm Pi fixture
        if: runner.os == 'Windows'
        run: node scripts/prepare-pi-fixture.mjs install
      - name: Real Pi localhost completion, timeout, and cancellation evidence
        if: runner.os == 'Windows'
        run: pnpm exec vitest run tests/integration/pi-owned-fixture.test.ts
        env:
          TALKING_QUILL_REQUIRE_PI_FIXTURE: '1'
          TALKING_QUILL_REAL_NPM_PI_PREFIX: ${{ github.workspace }}\\tmp\\tests\\pi-npm\\prefix
      - name: Source E2E with required owned Pi evidence
        if: runner.os == 'Windows'
        run: pnpm test:e2e
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TALKING_QUILL_REAL_NPM_PI_PREFIX: ${{ github.workspace }}\\tmp\\tests\\pi-npm\\prefix
      - name: Source E2E
        if: runner.os != 'Windows'
        run: pnpm test:e2e
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Clean owned Pi fixture
        if: always() && runner.os == 'Windows'
        run: node scripts/prepare-pi-fixture.mjs cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: welcome-visual-evidence-${{ runner.os }}
          path: tmp/review-screenshots/*.png
          if-no-files-found: warn
