name: Publish Windows x64 and ARM64 unsigned owner installers

on:
  workflow_run:
    workflows: [Build Windows x64 and ARM64 native setup release candidates]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Windows native release workflow run ID
        required: true
        type: string
      tag:
        description: Exact candidate tag, for example v0.0.54
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-windows-owner
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      commit: ${{ steps.run.outputs.commit }}
      sequence: ${{ steps.run.outputs.sequence }}
    steps:
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")"
          default_branch="$(gh api "repos/$REPOSITORY" --jq .default_branch)"
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .event <<<"$run")" = workflow_dispatch
          test "$(jq -r .head_branch <<<"$run")" = "$default_branch"
          test "$(jq -r .path <<<"$run")" = .github/workflows/release-unsigned.yml
          test "$(jq -r .head_repository.full_name <<<"$run")" = "$REPOSITORY"
          commit="$(jq -r .head_sha <<<"$run")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          sequence="$(jq -r .run_number <<<"$run")"
          [[ "$sequence" =~ ^[1-9][0-9]*$ ]]
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"

  publish:
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      attestations: read
      id-token: write
    environment: release-publication
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.inspect.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve the source version and reject a mismatched requested tag
        id: identity
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(node -p "'v' + require('./app/package.json').version")"
          test -z "$REQUESTED_TAG" || test "$REQUESTED_TAG" = "$tag"
          node scripts/release-source-preflight.mjs "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Fail closed unless publication controls remain protected
        env:
          RELEASE_CONTROL_TOKEN: ${{ secrets.RELEASE_CONTROL_TOKEN }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: node scripts/release-control-preflight.mjs
      - name: Download the preserved Windows native candidates
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.identity.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${TAG#v}"
          mkdir -p release-artifacts tmp
          artifacts="$(gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "windows-native-release-candidates")]')"
          test "$(jq length <<<"$artifacts")" -eq 1
          artifact_id="$(jq -r '.[0].id' <<<"$artifacts")"
          artifact_digest="$(jq -r '.[0].digest' <<<"$artifacts")"
          test "$(jq -r '.[0].expired' <<<"$artifacts")" = false
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > tmp/windows-native-release-candidates.zip
          printf '%s  %s\n' "${artifact_digest#sha256:}" tmp/windows-native-release-candidates.zip | sha256sum --check
          unzip -q tmp/windows-native-release-candidates.zip -d release-artifacts
          rm tmp/windows-native-release-candidates.zip
          (cd release-artifacts && sha256sum --check SHA256SUMS.txt)
          for arch in x64 arm64; do
            test -f "release-artifacts/Talking-Quill-$version-win-$arch-setup.exe"
            test -f "release-artifacts/provenance-win-$arch-setup.json"
            test -f "release-artifacts/windows-installer-ui-smoke-$arch.json"
            test -f "release-artifacts/windows-installer-success-fresh-$arch.json"
            test -f "release-artifacts/windows-local-migration-$arch.json"
            test -f "release-artifacts/windows-terminal-fault-candidate-$arch.json"
            node scripts/windows-installer-success-evidence.mjs --evidence "release-artifacts/windows-installer-success-fresh-$arch.json" --installer "release-artifacts/Talking-Quill-$version-win-$arch-setup.exe" --provenance "release-artifacts/provenance-win-$arch-setup.json" --arch "$arch" --operation fresh
            ARCH=$arch node -e 'const arch=process.env.ARCH,value=require(`./release-artifacts/windows-installer-success-fresh-${arch}.json`); if (!value.productionInterruptions?.fresh || !value.productionInterruptions?.removeFreshRecovery || !value.productionInterruptions?.uninstall || !value.productionInterruptions?.finishUninstallRecovery) process.exit(1)'
            ARCH=$arch node -e 'const arch=process.env.ARCH,m=require(`./release-artifacts/windows-local-migration-${arch}.json`),f=require(`./release-artifacts/windows-terminal-fault-candidate-${arch}.json`); if(m.mode!=="local-uninstall-preserve-fresh"||m.provenance!=="local-non-public"||m.sourceVersion!=="0.0.67"||m.targetVersion!==process.env.TAG.slice(1)||!m.passed||f.classification!=="nonpromotable-acceptance-fault")process.exit(1)'
            node scripts/windows-installer-ui-evidence.mjs --evidence "release-artifacts/windows-installer-ui-smoke-$arch.json" --installer "release-artifacts/Talking-Quill-$version-win-$arch-setup.exe" --provenance "release-artifacts/provenance-win-$arch-setup.json" --arch "$arch"
            if find release-artifacts -maxdepth 1 -type f \( -name '*-update.exe' -o -name 'latest-*.yml' -o -name 'release-identity-win-*.json' \) | grep -q .; then echo 'Fresh trust-root publication contains forbidden updater lineage assets.' >&2; exit 1; fi
          done
          node scripts/windows-release-validation.mjs release-artifacts --verify
          test -f release-artifacts/THIRD_PARTY_NOTICES.txt
          test -f release-artifacts/release-publication-manifest-v1.json
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          node scripts/publication-manifest.mjs --manifest release-artifacts/release-publication-manifest-v1.json --directory release-artifacts --repository "$REPOSITORY" --tag "$TAG" --sequence '${{ needs.inspect.outputs.sequence }}' --run-id "$RUN_ID" --source-commit '${{ needs.inspect.outputs.commit }}' --source-tree "$SOURCE_TREE" --public-key build/release-manifest-public-key.sec1
          gh attestation verify release-artifacts/* --repo "$REPOSITORY"
          RUN_ID="$RUN_ID" node --input-type=module - <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          import { validateReleaseManifest } from './scripts/release-manifest.mjs';
          const manifest=validateReleaseManifest(JSON.parse(fs.readFileSync('release-artifacts/release-manifest.json','utf8')));
          if (manifest.workflowRunId !== process.env.RUN_ID) throw new Error('Release manifest workflow run does not match promoted run');
          for (const asset of manifest.assets) { const bytes=fs.readFileSync(`release-artifacts/${asset.name}`); const hash=crypto.createHash('sha256').update(bytes).digest('hex'); if(bytes.length!==asset.bytes||hash!==asset.sha256) throw new Error(`Release asset mismatch: ${asset.name}`); }
          NODE

      - name: Require repository immutable releases before draft creation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY" --jq .immutable_releases)" = true

      - name: Reject publication rollback before draft creation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.identity.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publication-history
          mkdir publication-history
          gh api --paginate --slurp "repos/$REPOSITORY/releases?per_page=100" > publication-history/pages.json
          jq '[.[][] | select(.draft == false and .immutable == true)]' publication-history/pages.json > publication-history/releases.json
          printf '[]\n' > publication-history/index.json
          while IFS= read -r encoded; do
            release="$(base64 --decode <<<"$encoded")"
            id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"$release")"
            tag="$(jq -er '.tag_name' <<<"$release")"
            assets="$(gh api --paginate --slurp "repos/$REPOSITORY/releases/$id/assets?per_page=100")"
            mapfile -t manifest_assets < <(jq -r '.[][] | select(.name == "release-publication-manifest-v1.json") | .id' <<<"$assets")
            test "${#manifest_assets[@]}" -eq 1
            path="$(realpath "publication-history/$id.json")"
            gh api "repos/$REPOSITORY/releases/assets/${manifest_assets[0]}" -H 'Accept: application/octet-stream' > "$path"
            jq --argjson id "$id" --arg tag "$tag" --arg path "$path" '. + [{id:$id,tag:$tag,draft:false,immutable:true,manifestPath:$path}]' publication-history/index.json > publication-history/index.next
            mv publication-history/index.next publication-history/index.json
          done < <(jq -r '.[] | @base64' publication-history/releases.json)
          node scripts/publication-history.mjs --candidate release-artifacts/release-publication-manifest-v1.json --candidate-tag "$TAG" --candidate-sequence '${{ needs.inspect.outputs.sequence }}' --history-index publication-history/index.json --repository "$REPOSITORY" --public-key build/release-manifest-public-key.sec1

      - name: Create the unchanged installer as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ needs.inspect.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(node -e 'const p=require("./release-artifacts/release-publication-manifest-v1.json").payload; for (const {name} of p.assets) console.log(`release-artifacts/${name}`); console.log("release-artifacts/release-publication-manifest-v1.json"); console.log("release-artifacts/SHA256SUMS.txt")')
          test "${#assets[@]}" -gt 2
          gh release create "$TAG" "${assets[@]}" \
            --repo "$REPOSITORY" \
            --target "$COMMIT" \
            --title "Talking Quill $TAG Windows native unsigned owner" \
            --notes "Unsigned Windows x64 and ARM64 installers with the gateway and detached keyboard owner." \
            --draft

      - name: Verify the remote draft bytes before stable promotion
        id: verified_draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ needs.inspect.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh api "repos/$REPOSITORY/releases" --paginate --jq ".[] | select(.draft == true and .tag_name == \"$TAG\")" > draft.json
          release_id="$(jq -er 'select(.draft == true) | .id | select(type == "number" and . > 0)' draft.json)"
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          jq -er '.assets[] | select(.id | type == "number" and . > 0) | [.id, .name] | @tsv' draft.json > draft-assets.tsv
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            [[ "$asset_name" =~ ^[A-Za-z0-9._-]+$ ]]
            gh api "repos/$REPOSITORY/releases/assets/$asset_id" \
              -H 'Accept: application/octet-stream' > "downloaded/$asset_name"
          done < draft-assets.tsv
          node scripts/verify-draft-release.mjs \
            "$TAG" "$COMMIT" \
            release-artifacts/release-manifest.json \
            release-artifacts/SHA256SUMS.txt \
            draft.json downloaded

      # Fetch release-owned metadata again in the promotion step. PATCH is the next
      # network operation and the final command.
      - name: Promote the fully verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ steps.verified_draft.outputs.release_id }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ needs.inspect.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY" --jq .immutable_releases)" = true
          rm -rf publication-history
          mkdir publication-history
          gh api --paginate --slurp "repos/$REPOSITORY/releases?per_page=100" > publication-history/pages.json
          jq '[.[][] | select(.draft == false and .immutable == true)]' publication-history/pages.json > publication-history/releases.json
          printf '[]\n' > publication-history/index.json
          while IFS= read -r encoded; do
            release="$(base64 --decode <<<"$encoded")"
            id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"$release")"
            tag="$(jq -er '.tag_name' <<<"$release")"
            assets="$(gh api --paginate --slurp "repos/$REPOSITORY/releases/$id/assets?per_page=100")"
            mapfile -t manifest_assets < <(jq -r '.[][] | select(.name == "release-publication-manifest-v1.json") | .id' <<<"$assets")
            test "${#manifest_assets[@]}" -eq 1
            path="$(realpath "publication-history/$id.json")"
            gh api "repos/$REPOSITORY/releases/assets/${manifest_assets[0]}" -H 'Accept: application/octet-stream' > "$path"
            jq --argjson id "$id" --arg tag "$tag" --arg path "$path" '. + [{id:$id,tag:$tag,draft:false,immutable:true,manifestPath:$path}]' publication-history/index.json > publication-history/index.next
            mv publication-history/index.next publication-history/index.json
          done < <(jq -r '.[] | @base64' publication-history/releases.json)
          node scripts/publication-history.mjs --candidate release-artifacts/release-publication-manifest-v1.json --candidate-tag "$TAG" --candidate-sequence '${{ needs.inspect.outputs.sequence }}' --history-index publication-history/index.json --repository "$REPOSITORY" --public-key build/release-manifest-public-key.sec1
          curl --fail-with-body --silent --show-error --dump-header promotion-release.headers --output promotion-release.json -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPOSITORY/releases/$RELEASE_ID"
          etag="$(awk 'BEGIN{IGNORECASE=1} /^etag:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' promotion-release.headers)"
          test -n "$etag"
          node - <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('draft.json', 'utf8'));
          const fresh = JSON.parse(fs.readFileSync('promotion-release.json', 'utf8'));
          const assets = (value) => value.assets.map(({id,name,size,digest}) => ({id,name,size,digest: digest ?? null})).sort((left,right) => left.name.localeCompare(right.name));
          const names = fresh.assets.map(({name}) => name);
          const ids = fresh.assets.map(({id}) => id);
          if (!fresh.draft || fresh.prerelease || fresh.tag_name !== process.env.TAG || fresh.target_commitish !== process.env.COMMIT || String(fresh.id) !== process.env.RELEASE_ID || new Set(names).size !== names.length || new Set(ids).size !== ids.length || JSON.stringify(assets(fresh)) !== JSON.stringify(assets(before))) throw new Error('Fresh promotion release metadata differs from the byte-verified draft snapshot');
          NODE
          response="$(curl --fail-with-body --silent --show-error --request PATCH -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "If-Match: $etag" --data '{"draft":false,"prerelease":false,"make_latest":"legacy"}' "https://api.github.com/repos/$REPOSITORY/releases/$RELEASE_ID")" && RESPONSE="$response" node -e 'const fs=require("node:fs"), value=JSON.parse(process.env.RESPONSE), before=JSON.parse(fs.readFileSync("promotion-release.json","utf8")), assets=x=>x.assets.map(({id,name,size,digest})=>({id,name,size,digest:digest??null})).sort((a,b)=>a.name.localeCompare(b.name)); if (value.id !== Number(process.env.RELEASE_ID) || value.draft !== false || value.prerelease !== false || value.tag_name !== process.env.TAG || value.target_commitish !== process.env.COMMIT || JSON.stringify(assets(value)) !== JSON.stringify(assets(before))) throw new Error("Published release response identity or asset metadata mismatch")'

      - name: Require immutable published release and verify every asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.identity.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY" --jq .immutable_releases)" = true
          published="$(gh api "repos/$REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r .draft <<<"$published")" = false
          test "$(jq -r .immutable <<<"$published")" = true
          mapfile -t assets < <(jq -r '.assets[].name' <<<"$published")
          for name in "${assets[@]}"; do
            gh release verify-asset "$TAG" "release-artifacts/$name" --repo "$REPOSITORY"
          done
