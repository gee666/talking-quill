name: Publish Windows x64 and ARM64 unsigned owner installers

on:
  workflow_run:
    workflows: [Build Windows x64 and ARM64 native setup release candidates]
    branches: [master]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-windows-owner
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'gee666/talking-quill' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Authenticate successful canonical producer and current master tip
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .event <<<"$run")" = workflow_dispatch
          test "$(jq -r .head_branch <<<"$run")" = master
          test "$(jq -r .path <<<"$run")" = .github/workflows/release-unsigned.yml
          test "$(jq -r .head_repository.full_name <<<"$run")" = "$GITHUB_REPOSITORY"
          commit="$(jq -r .head_sha <<<"$run")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = master
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" = "$commit"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - id: identity
        name: Resolve coordinated source version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(node -p "'v' + require('./app/package.json').version")"
          node scripts/release-source-preflight.mjs "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish GitHub Release
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.inspect.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-native-release-candidates
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: tmp/release-artifacts
      - name: Bind the downloaded manifest to the successful producer
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          COMMIT: ${{ needs.inspect.outputs.commit }}
          TAG: ${{ needs.inspect.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { validateReleaseManifest } from './scripts/release-manifest.mjs';
          const value = validateReleaseManifest(JSON.parse(readFileSync('tmp/release-artifacts/release-manifest.json', 'utf8')));
          const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          if (value.workflowRunId !== process.env.RUN_ID || value.sourceCommit !== process.env.COMMIT || value.sourceTree !== tree || value.tag !== process.env.TAG || value.architecture !== 'x64+arm64') throw new Error('Downloaded manifest does not belong to the successful producer');
          NODE
          (cd tmp/release-artifacts && sha256sum --check SHA256SUMS.txt)
      - name: Create and verify a complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.inspect.outputs.tag }}
          COMMIT: ${{ needs.inspect.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/master --jq .sha)" = "$COMMIT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG appeared while the release was building." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG appeared while the release was building." >&2
            exit 1
          fi
          mkdir -p tmp/release-verification/downloaded
          draft_created=false
          draft_id=''
          cleanup_draft() {
            if [ "$draft_created" = true ] && [[ "$draft_id" =~ ^[0-9]+$ ]] && \
              gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
                > tmp/release-verification/cleanup-draft.json 2>/dev/null && \
              node -e '
                const { readFileSync } = require("node:fs");
                const release = JSON.parse(readFileSync("tmp/release-verification/cleanup-draft.json", "utf8"));
                if (release.draft !== true || release.tag_name !== process.env.TAG || release.target_commitish !== process.env.COMMIT) process.exit(1);
              '; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$draft_id" || true
            fi
          }
          trap cleanup_draft EXIT
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            --raw-field tag_name="$TAG" \
            --raw-field target_commitish="$COMMIT" \
            --raw-field name="Talking Quill $TAG (unsigned)" \
            --field draft=true \
            --field prerelease=false \
            --raw-field body="Unsigned fresh Windows x64 and ARM64 installers. Automated source validation, package inspection and native UI cancellation smoke completed. Real-reboot, migration and protected installed-acceptance evidence were not collected. No signed update feed is published." \
            > tmp/release-verification/created-draft.json
          draft_id="$(node -e '
            const { readFileSync } = require("node:fs");
            const release = JSON.parse(readFileSync("tmp/release-verification/created-draft.json", "utf8"));
            if (!Number.isInteger(release.id)) process.exit(1);
            process.stdout.write(String(release.id));
          ')"
          draft_created=true
          node -e '
            const { readFileSync } = require("node:fs");
            const release = JSON.parse(readFileSync("tmp/release-verification/created-draft.json", "utf8"));
            if (release.draft !== true || release.tag_name !== process.env.TAG || release.target_commitish !== process.env.COMMIT) process.exit(1);
          '
          gh release upload "$TAG" tmp/release-artifacts/* --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" > tmp/release-verification/draft.json
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir tmp/release-verification/downloaded
          node scripts/verify-draft-release.mjs --ordinary-unsigned \
            "$TAG" "$COMMIT" \
            tmp/release-artifacts/release-manifest.json \
            tmp/release-artifacts/SHA256SUMS.txt \
            tmp/release-verification/draft.json \
            tmp/release-verification/downloaded
          trap - EXIT
      - name: Publish only after byte verification
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.inspect.outputs.tag }}
          COMMIT: ${{ needs.inspect.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/master --jq .sha)" = "$COMMIT"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          tag_verified=false
          for attempt in {1..12}; do
            if git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" && \
              test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$COMMIT"; then
              tag_verified=true
              break
            fi
            sleep 5
          done
          if [ "$tag_verified" != true ]; then
            echo 'Published release tag does not resolve to the release commit.' >&2
            exit 1
          fi
          for attempt in {1..12}; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > tmp/release-verification/public-tag.json
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" > tmp/release-verification/public-latest.json
            if node scripts/verify-public-release.mjs \
              "$TAG" "$COMMIT" \
              tmp/release-artifacts/release-manifest.json \
              tmp/release-verification/public-tag.json \
              tmp/release-verification/public-latest.json; then
              exit 0
            fi
            sleep 5
          done
          echo 'Published release did not become the public latest release in time.' >&2
          exit 1
