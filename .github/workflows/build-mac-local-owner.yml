          const i32=n=>{const b=Buffer.alloc(4);b.writeInt32BE(Number(n));return b}; const u32=n=>{const b=Buffer.alloc(4);b.writeUInt32BE(Number(n));return b}; const u64=n=>Buffer.from(BigInt(n).toString(16).padStart(16,'0'),'hex');
          const mac=crypto.createHmac('sha256',Buffer.from(process.env.KEYCHAIN_KEY,'hex')).update('talking-quill/macos-keychain-fixture/v1\0').update(u32(f[0])).update(u32(f[1])).update(u64(f[2])).update(f[3]).update(i32(f[4])).update(i32(f[5])).digest('hex'); if(mac!==f[6])process.exit(1);
