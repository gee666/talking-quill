name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing verified draft tag to publish
        required: true
        type: string
      dry_run:
        description: Verify deterministic local publication fixtures without credentials or mutation
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  external-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ !inputs.dry_run && 'release-trust' || null }}
    steps:
      - name: Require canonical protected default-branch dispatch before checkout
        env:
          EXPECTED_REPOSITORY: gee666/talking-quill
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify the protected controller bytes before executing controller code
        if: ${{ !inputs.dry_run }}
        env: { EXPECTED_POLICY_SHA256: '${{ vars.RELEASE_POLICY_TREE_SHA256 }}' }
        run: |
          test "$EXPECTED_POLICY_SHA256" != ''
          actual="$(git ls-tree HEAD -- .npmrc .github/workflows/release.yml .github/workflows/publish-release.yml release.config.json package.json pnpm-lock.yaml pnpm-workspace.yaml app/package.json app/after-pack.cjs build/electron-builder.yml build/installer.nsh build/mac-sign.cjs scripts/release-control-preflight.mjs scripts/verify-trusted-candidate.mjs scripts/verify-release-tag.mjs scripts/artifact-provenance.mjs scripts/assemble-release.mjs scripts/release-checksums.mjs scripts/verify-draft-release.mjs scripts/verify-public-release.mjs scripts/verify-macos-release.mjs scripts/generate-notices.mjs scripts/inspect-package.mjs scripts/native-architecture.mjs scripts/package-policy.mjs scripts/release-config.mjs scripts/secret-rules.mjs | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_POLICY_SHA256"
      - run: node scripts/release-control-preflight.mjs
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_CONTROL_TOKEN: ${{ secrets.RELEASE_CONTROL_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !inputs.dry_run }}
        with:
          name: trusted-publication-controller
          path: scripts/verify-trusted-candidate.mjs
          if-no-files-found: error

  dry-run-publication:
    if: ${{ inputs.dry_run }}
    needs: external-controls
    permissions: { contents: read }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.13.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify deterministic local/mock draft, download, and public-response fixtures only
        run: pnpm exec vitest run tests/unit/release-tooling.test.ts tests/unit/release-control.test.ts
      - run: echo 'Dry-run publication is credential-free and cannot mutate GitHub.'

  verify-platform-signatures:
    if: ${{ !inputs.dry_run }}
    needs: external-controls
    environment: release-publication
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win, arch: x64 }
          - { os: windows-11-arm, target: win, arch: arm64 }
          - { os: macos-15-intel, target: mac, arch: x64 }
          - { os: macos-15, target: mac, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download exact draft assets without executing them
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --dir tmp/signature-verification
        shell: pwsh
      - name: Reverify Windows Authenticode identity and timestamp
        if: matrix.target == 'win'
        shell: pwsh
        env: { WINDOWS_SIGNING_THUMBPRINT: '${{ vars.WINDOWS_SIGNING_THUMBPRINT }}' }
        run: |
          if ($env:WINDOWS_SIGNING_THUMBPRINT -notmatch '^[A-Fa-f0-9]{40}$') { throw 'Protected Windows signer thumbprint is missing.' }
          $path = "tmp/signature-verification/Talking-Quill-$($env:RELEASE_TAG.Substring(1))-win-${{ matrix.arch }}.exe"
          $signature = Get-AuthenticodeSignature $path
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or $null -eq $signature.TimeStamperCertificate -or $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_SIGNING_THUMBPRINT) { throw 'Published Windows candidate signature is invalid, untimestamped, or unexpected.' }
      - name: Reverify macOS signature, hardened runtime, entitlements, architecture, and notarization
        if: matrix.target == 'mac'
        env: { APPLE_TEAM_ID: '${{ vars.APPLE_TEAM_ID }}' }
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p tmp/signature-verification/unzip
          ditto -x -k "tmp/signature-verification/Talking-Quill-$version-mac-${{ matrix.arch }}.zip" tmp/signature-verification/unzip
          node scripts/verify-macos-release.mjs 'tmp/signature-verification/unzip/Talking Quill.app' "tmp/signature-verification/Talking-Quill-$version-mac-${{ matrix.arch }}.dmg" "tmp/signature-verification/Talking-Quill-$version-mac-${{ matrix.arch }}.zip" "$APPLE_TEAM_ID" '${{ matrix.arch }}' "$version"
      - name: Bind Windows signature verification to the exact draft asset digest
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $name = "Talking-Quill-$($env:RELEASE_TAG.Substring(1))-win-${{ matrix.arch }}.exe"
          $hash = (Get-FileHash "tmp/signature-verification/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('tmp/verified-signature-digests.txt', "$hash  $name`n", [Text.UTF8Encoding]::new($false))
      - name: Bind macOS signature verification to both exact draft asset digests
        if: matrix.target == 'mac'
        run: |
          version="${RELEASE_TAG#v}"
          cd tmp/signature-verification
          shasum -a 256 "Talking-Quill-$version-mac-${{ matrix.arch }}.dmg" "Talking-Quill-$version-mac-${{ matrix.arch }}.zip" > ../verified-signature-digests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-signatures-${{ matrix.target }}-${{ matrix.arch }}
          path: tmp/verified-signature-digests.txt
          if-no-files-found: error

  publish:
    if: ${{ !inputs.dry_run }}
    needs: [external-controls, verify-platform-signatures]
    environment: release-publication
    permissions:
      contents: write
      attestations: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: trusted-publication-controller, path: tmp/controller }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: verified-signatures-*
          path: tmp/platform-signatures
      - name: Require all six exact platform-signature digest bindings
        run: |
          cat tmp/platform-signatures/*/verified-signature-digests.txt | sort > tmp/verified-platform-digests.txt
          test "$(wc -l < tmp/verified-platform-digests.txt)" -eq 6
      - id: trust
        name: Reverify protected signer, policy, and default-branch ancestry
        env:
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG_SIGNING_PUBLIC_KEY: ${{ secrets.RELEASE_TAG_SIGNING_PUBLIC_KEY }}
          RELEASE_TAG_SIGNER_FINGERPRINTS: ${{ vars.RELEASE_TAG_SIGNER_FINGERPRINTS }}
          RELEASE_POLICY_TREE_SHA256: ${{ vars.RELEASE_POLICY_TREE_SHA256 }}
        run: |
          git fetch --no-tags origin "+refs/heads/$RELEASE_DEFAULT_BRANCH:refs/remotes/origin/$RELEASE_DEFAULT_BRANCH"
          node tmp/controller/verify-trusted-candidate.mjs "$RELEASE_TAG" .
      - name: Fail closed until external release blockers are approved for this exact candidate
        env:
          APPROVAL: ${{ vars.RELEASE_EXTERNAL_BLOCKERS_APPROVAL }}
          COMMIT: ${{ steps.trust.outputs.commit }}
        run: test "$APPROVAL" = "$RELEASE_TAG@$COMMIT"
      - name: Download the authenticated draft twice and capture its exact API identity
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p release-artifacts tmp/publication/redownload
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > tmp/publication/draft.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir tmp/publication/redownload
      - name: Verify attestations and exact re-downloaded draft bytes
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for asset in release-artifacts/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
          node scripts/verify-draft-release.mjs "$RELEASE_TAG" '${{ steps.trust.outputs.commit }}' release-artifacts/release-manifest.json release-artifacts/SHA256SUMS.txt tmp/publication/draft.json tmp/publication/redownload
          (cd release-artifacts && sha256sum Talking-Quill-* | sort) > tmp/downloaded-platform-digests.txt
          diff -u tmp/verified-platform-digests.txt tmp/downloaded-platform-digests.txt
      - name: Re-resolve, verify, and conditionally publish the unchanged draft
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git diff --quiet HEAD -- .
          git diff --cached --quiet HEAD -- .
          rm -rf tmp/publication/prepublish
          mkdir -p tmp/publication/prepublish
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          curl --fail-with-body --silent --show-error --dump-header tmp/publication/prepublish.headers --output tmp/publication/prepublish.json --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' --header "Authorization: Bearer $GH_TOKEN" "$api"
          etag="$(awk 'tolower($1) == "etag:" { print $2 }' tmp/publication/prepublish.headers | tr -d '\r')"
          test "$etag" != ''
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir tmp/publication/prepublish
          node scripts/verify-draft-release.mjs "$RELEASE_TAG" '${{ steps.trust.outputs.commit }}' release-artifacts/release-manifest.json release-artifacts/SHA256SUMS.txt tmp/publication/prepublish.json tmp/publication/prepublish
          (cd tmp/publication/prepublish && sha256sum Talking-Quill-* | sort) > tmp/prepublish-platform-digests.txt
          diff -u tmp/verified-platform-digests.txt tmp/prepublish-platform-digests.txt
          release_id="$(node -e "const r=require('./tmp/publication/prepublish.json');if(!Number.isSafeInteger(r.id))process.exit(1);process.stdout.write(String(r.id))")"
          curl --fail-with-body --silent --show-error --request PATCH --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' --header "Authorization: Bearer $GH_TOKEN" --header "If-Match: $etag" --header 'Content-Type: application/json' --data '{"draft":false,"prerelease":false,"make_latest":"true"}' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id" > tmp/publication/publish-response.json
      - name: Re-download published assets and require exact verified bytes
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p tmp/publication/public-download
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir tmp/publication/public-download
          diff -u <(find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort) <(find tmp/publication/public-download -maxdepth 1 -type f -printf '%f\n' | sort)
          for asset in release-artifacts/*; do
            cmp "$asset" "tmp/publication/public-download/$(basename "$asset")"
          done
      - name: Fail closed unless the public latest endpoint exposes the exact release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for attempt in $(seq 1 12); do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > tmp/publication/published.json
            if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > tmp/publication/latest.json; then
              if node scripts/verify-public-release.mjs "$RELEASE_TAG" '${{ steps.trust.outputs.commit }}' release-artifacts/release-manifest.json tmp/publication/published.json tmp/publication/latest.json; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Public latest release did not converge to the exact verified candidate.' >&2
          exit 1
