name: Release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Strict semver tag whose version matches package metadata
        required: true
        default: v1.0.2
        type: string
      dry_run:
        description: Build and validate every stage without credentials or GitHub Release mutation
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  DRY_RUN: ${{ inputs.dry_run }}
  TALKING_QUILL_DETERMINISTIC: ${{ inputs.dry_run && '1' || '0' }}

jobs:
  external-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ !inputs.dry_run && 'release-trust' || null }}
    steps:
      - name: Require canonical protected default-branch dispatch before checkout
        env:
          EXPECTED_REPOSITORY: gee666/talking-quill
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify the protected controller bytes before executing controller code
        if: ${{ !inputs.dry_run }}
        env: { EXPECTED_POLICY_SHA256: '${{ vars.RELEASE_POLICY_TREE_SHA256 }}' }
        run: |
          test "$EXPECTED_POLICY_SHA256" != ''
          actual="$(git ls-tree HEAD -- .github/workflows/release.yml .github/workflows/publish-release.yml release.config.json package.json pnpm-lock.yaml pnpm-workspace.yaml app/package.json app/after-pack.cjs build/electron-builder.yml build/electron-builder.packaged-test.yml build/installer.nsh build/mac-sign.cjs scripts/release-control-preflight.mjs scripts/verify-trusted-candidate.mjs scripts/verify-release-tag.mjs scripts/artifact-provenance.mjs scripts/assemble-release.mjs scripts/release-checksums.mjs scripts/verify-draft-release.mjs scripts/verify-public-release.mjs scripts/verify-macos-release.mjs scripts/run-instrumented-packaged-media-e2e.mjs scripts/inspect-package.mjs scripts/package-policy.mjs | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_POLICY_SHA256"
      - name: Fail closed on branch and environment controls before a real candidate
        if: ${{ !inputs.dry_run }}
        run: node scripts/release-control-preflight.mjs
        env:
          RELEASE_CONTROL_TOKEN: ${{ secrets.RELEASE_CONTROL_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !inputs.dry_run }}
        with:
          name: trusted-release-controller
          path: scripts/verify-trusted-candidate.mjs
          if-no-files-found: error

  preflight:
    needs: external-controls
    runs-on: windows-latest
    timeout-minutes: 90
    environment: ${{ !inputs.dry_run && 'release-trust' || null }}
    outputs:
      tag: ${{ steps.trust.outputs.tag || steps.identity.outputs.tag }}
      version: ${{ steps.trust.outputs.version || steps.identity.outputs.version }}
      commit: ${{ steps.trust.outputs.commit || steps.identity.outputs.commit }}
      notes_path: ${{ steps.trust.outputs.notes_path || steps.identity.outputs.notes_path }}
      repository: ${{ steps.trust.outputs.repository || steps.identity.outputs.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.dry_run && github.sha || inputs.release_tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ !inputs.dry_run }}
        with: { name: trusted-release-controller, path: tmp/controller }
      - id: trust
        name: Verify protected key, signer, policy, tag, and default-branch ancestry
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG_SIGNING_PUBLIC_KEY: ${{ secrets.RELEASE_TAG_SIGNING_PUBLIC_KEY }}
          RELEASE_TAG_SIGNER_FINGERPRINTS: ${{ vars.RELEASE_TAG_SIGNER_FINGERPRINTS }}
          RELEASE_POLICY_TREE_SHA256: ${{ vars.RELEASE_POLICY_TREE_SHA256 }}
        run: |
          git fetch --no-tags origin "+refs/heads/$env:RELEASE_DEFAULT_BRANCH`:refs/remotes/origin/$env:RELEASE_DEFAULT_BRANCH"
          node tmp/controller/verify-trusted-candidate.mjs $env:RELEASE_TAG .
      - name: Fail closed before setup when the workflow repository is not canonical
        run: node -e "const c=require('./release.config.json');if(process.env.GITHUB_REPOSITORY!==c.repository)throw Error('Canonical release repository mismatch')"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with: { toolchain: 1.97.1, components: 'rustfmt, clippy' }
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit*
            helper/target
          key: rust-release-${{ runner.os }}-${{ runner.arch }}-1.97.1-audit-0.22.2-${{ hashFiles('helper/Cargo.lock') }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.13.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fetch-targets
      - id: identity
        if: ${{ inputs.dry_run }}
        name: Resolve deterministic credential-free dry-run identity
        shell: pwsh
        run: |
          node scripts/verify-release-tag.mjs $env:RELEASE_TAG --dry-run
      - run: pnpm validate
      - run: pnpm test:coverage
      - run: pnpm test:e2e
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - run: node scripts/ensure-cargo-audit.mjs
      - run: pnpm security:gate
      - name: Reject candidate modifications after validation
        shell: pwsh
        run: if ((git status --porcelain=v1 --untracked-files=normal).Length -ne 0) { throw 'Candidate validation modified the trusted source tree.' }

  unsigned-package:
    needs: [preflight, external-controls]
    timeout-minutes: 90
    env:
      TALKING_QUILL_RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: windows-latest,
              target: win,
              arch: x64,
              packageRoot: release/win-unpacked,
              requirement: nsis,
            }
          - {
              os: windows-11-arm,
              target: win,
              arch: arm64,
              packageRoot: release/win-arm64-unpacked,
              requirement: nsis,
            }
          - {
              os: macos-15-intel,
              target: mac,
              arch: x64,
              packageRoot: release/mac,
              requirement: dmg-zip,
            }
          - {
              os: macos-15,
              target: mac,
              arch: arm64,
              packageRoot: release/mac-arm64,
              requirement: dmg-zip,
            }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with: { toolchain: 1.97.1 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.13.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fetch-targets
      - name: Require an unmodified candidate before unsigned build
        shell: pwsh
        run: if ((git status --porcelain=v1 --untracked-files=normal).Length -ne 0) { throw 'Unsigned build requires an unmodified candidate.' }
      - run: pnpm build
      - run: pnpm build:helper -- --platform ${{ matrix.target }} --arch ${{ matrix.arch }}
      - name: Build credential-free unsigned candidate
        working-directory: app
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: pnpm exec electron-builder --config ../build/electron-builder.yml --${{ matrix.target }} ${{ matrix.target == 'win' && 'nsis' || 'dmg zip' }} --${{ matrix.arch }} --publish never
      - name: Reject build-time candidate modifications
        shell: pwsh
        run: if ((git status --porcelain=v1 --untracked-files=normal).Length -ne 0) { throw 'Unsigned build modified the candidate source tree.' }
      - id: inspect
        run: pnpm package:inspect -- ${{ matrix.packageRoot }}
        env:
          TALKING_QUILL_REQUIRE_CLEAN_SOURCE: '1'
          TALKING_QUILL_PACKAGE_INSPECTION_STRICT: '1'
          TALKING_QUILL_PACKAGE_ARTIFACTS_REQUIRED: ${{ matrix.requirement }}
          TALKING_QUILL_PACKAGE_TARGET: ${{ matrix.target }}
          TALKING_QUILL_PACKAGE_ARCH: ${{ matrix.arch }}
      - name: Provision owned pinned npm Pi fixture
        if: matrix.target == 'win' && matrix.arch == 'x64'
        run: node scripts/prepare-pi-fixture.mjs install
      - name: Real Pi localhost completion, timeout, and cancellation evidence
        if: matrix.target == 'win' && matrix.arch == 'x64'
        run: pnpm exec vitest run tests/integration/pi-owned-fixture.test.ts
        env:
          TALKING_QUILL_REQUIRE_PI_FIXTURE: '1'
          TALKING_QUILL_REAL_NPM_PI_PREFIX: ${{ github.workspace }}\\tmp\\tests\\pi-npm\\prefix
      - name: Required packaged stale-PATH Pi evidence
        if: matrix.target == 'win' && matrix.arch == 'x64'
        run: pnpm exec playwright test tests/e2e/packaged.spec.ts --project=packaged --grep "stale PATH"
        env:
          TALKING_QUILL_PACKAGE_ROOT: ${{ matrix.packageRoot }}
          TALKING_QUILL_PACKAGE_TARGET: ${{ matrix.target }}
          TALKING_QUILL_REAL_NPM_PI_PREFIX: ${{ github.workspace }}\\tmp\\tests\\pi-npm\\prefix
      - run: pnpm test:packaged
        env:
          TALKING_QUILL_PACKAGE_ROOT: ${{ matrix.packageRoot }}
          TALKING_QUILL_PACKAGE_TARGET: ${{ matrix.target }}
      - name: Clean owned Pi fixture
        if: always() && matrix.target == 'win' && matrix.arch == 'x64'
        run: node scripts/prepare-pi-fixture.mjs cleanup
      - run: pnpm artifact-provenance:verify
        env:
          TALKING_QUILL_REQUIRE_CLEAN_SOURCE: '1'
          TALKING_QUILL_PACKAGE_ROOT: ${{ matrix.packageRoot }}
          TALKING_QUILL_PACKAGE_TARGET: ${{ matrix.target }}
          TALKING_QUILL_PACKAGE_ARCH: ${{ matrix.arch }}
      - name: Prepare unsigned dry-run assembly inputs
        shell: pwsh
        run: |
          $destination = New-Item -ItemType Directory -Force tmp/release-upload
          $artifacts = @(Get-ChildItem release -File | Where-Object { $_.Extension -in @('.exe', '.dmg', '.zip') })
          $expected = if ('${{ matrix.target }}' -eq 'win') { 1 } else { 2 }
          if ($artifacts.Count -ne $expected) { throw "Unexpected unsigned artifact count: $($artifacts.Count)" }
          $artifacts | Copy-Item -Destination $destination
          Copy-Item artifact-provenance.json (Join-Path $destination 'provenance-${{ matrix.target }}-${{ matrix.arch }}.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.target }}-${{ matrix.arch }}
          path: tmp/release-upload/*
          if-no-files-found: error
      - name: Upload the inspected prebuilt application for the isolated trusted signing stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prebuilt-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ matrix.packageRoot }}
          if-no-files-found: error

  package:
    if: ${{ !inputs.dry_run }}
    needs: [preflight, unsigned-package]
    env:
      TALKING_QUILL_RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: windows-latest,
              target: win,
              arch: x64,
              packageRoot: release/win-unpacked,
              requirement: nsis,
            }
          - {
              os: windows-11-arm,
              target: win,
              arch: arm64,
              packageRoot: release/win-arm64-unpacked,
              requirement: nsis,
            }
          - {
              os: macos-15-intel,
              target: mac,
              arch: x64,
              packageRoot: release/mac,
              requirement: dmg-zip,
            }
          - {
              os: macos-15,
              target: mac,
              arch: arm64,
              packageRoot: release/mac-arm64,
              requirement: dmg-zip,
            }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require trusted default branch to equal the authorized candidate
        shell: pwsh
        run: if ((git rev-parse HEAD^{commit}) -ne '${{ needs.preflight.outputs.commit }}') { throw 'Signing checkout is not the authorized protected-branch candidate.' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prebuilt-${{ matrix.target }}-${{ matrix.arch }}
          path: tmp/prebuilt
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.13.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Require a clean committed trusted source tree before signing prebuilt bytes
        shell: pwsh
        run: if ((git status --porcelain).Length -ne 0) { throw 'Release packaging requires a clean source tree.' }
      - name: Validate real signing and notarization secrets
        shell: pwsh
        env:
          CSC_LINK: ${{ matrix.target == 'win' && secrets.WINDOWS_CSC_LINK || secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'win' && secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.MACOS_CSC_KEY_PASSWORD }}
          WINDOWS_SIGNING_THUMBPRINT: ${{ matrix.target == 'win' && secrets.WINDOWS_SIGNING_THUMBPRINT || '' }}
          APPLE_ID: ${{ matrix.target == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.target == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.target == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) { throw 'Signing certificate secrets are required; identity discovery or ad-hoc signing is forbidden.' }
          if ('${{ matrix.target }}' -eq 'win' -and $env:WINDOWS_SIGNING_THUMBPRINT -notmatch '^[A-Fa-f0-9]{40}$') { throw 'The expected Windows signer SHA-1 thumbprint is required.' }
          if ('${{ matrix.target }}' -eq 'mac' -and @($env:APPLE_ID,$env:APPLE_APP_SPECIFIC_PASSWORD,$env:APPLE_TEAM_ID).Where({[string]::IsNullOrWhiteSpace($_)}).Count -gt 0) { throw 'All Apple notarization secrets are required.' }
      - name: Sign and notarize only the previously inspected prebuilt application
        working-directory: app
        env:
          CSC_LINK: ${{ matrix.target == 'win' && secrets.WINDOWS_CSC_LINK || secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'win' && secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ matrix.target == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.target == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.target == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm exec electron-builder --config ../build/electron-builder.yml --prepackaged '${{ matrix.target == 'mac' && '../tmp/prebuilt/Talking Quill.app' || '../tmp/prebuilt' }}' --${{ matrix.target }} ${{ matrix.target == 'win' && 'nsis' || 'dmg zip' }} --${{ matrix.arch }} --publish never
      - name: Verify Windows Authenticode chain, identity, and timestamp
        if: matrix.target == 'win'
        shell: pwsh
        env: { WINDOWS_SIGNING_THUMBPRINT: '${{ secrets.WINDOWS_SIGNING_THUMBPRINT }}' }
        run: |
          $expected = $env:WINDOWS_SIGNING_THUMBPRINT.ToUpperInvariant()
          $files = @((Get-ChildItem release -Filter 'Talking-Quill-*.exe'), (Get-Item '${{ matrix.packageRoot }}/Talking Quill.exe'), (Get-Item '${{ matrix.packageRoot }}/resources/helper/talking-quill-helper.exe'))
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or $null -eq $signature.TimeStamperCertificate -or $signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expected) { throw "Invalid, untimestamped, or unexpected Authenticode signature: $file ($($signature.Status))" }
          }
      - name: Verify macOS identity, hardened runtime, entitlements, architecture, and notarization
        if: matrix.target == 'mac'
        env: { APPLE_TEAM_ID: '${{ secrets.APPLE_TEAM_ID }}' }
        run: node scripts/verify-macos-release.mjs '${{ matrix.packageRoot }}/Talking Quill.app' release/Talking-Quill-${{ needs.preflight.outputs.version }}-mac-${{ matrix.arch }}.dmg release/Talking-Quill-${{ needs.preflight.outputs.version }}-mac-${{ matrix.arch }}.zip "$APPLE_TEAM_ID" '${{ matrix.arch }}' '${{ needs.preflight.outputs.version }}'
      - name: Recheck trusted-source immutability after signing and platform tooling
        shell: pwsh
        run: if ((git status --porcelain).Length -ne 0) { throw 'Signing or packaging mutated the trusted source tree.' }
      - id: inspect
        run: pnpm package:inspect -- ${{ matrix.packageRoot }}
        env:
          TALKING_QUILL_REQUIRE_CLEAN_SOURCE: '1'
          TALKING_QUILL_PACKAGE_INSPECTION_STRICT: '1'
          TALKING_QUILL_PACKAGE_ARTIFACTS_REQUIRED: ${{ matrix.requirement }}
          TALKING_QUILL_PACKAGE_TARGET: ${{ matrix.target }}
          TALKING_QUILL_PACKAGE_ARCH: ${{ matrix.arch }}
      - name: Do not execute candidate code after signing credentials are exposed
        run: echo 'Unsigned packaged smoke already passed; signed bytes receive trusted static/signature/provenance verification only.'
      - run: pnpm artifact-provenance:verify
        env:
          {
            TALKING_QUILL_REQUIRE_CLEAN_SOURCE: '1',
            TALKING_QUILL_PACKAGE_ROOT: '${{ matrix.packageRoot }}',
            TALKING_QUILL_PACKAGE_TARGET: '${{ matrix.target }}',
            TALKING_QUILL_PACKAGE_ARCH: '${{ matrix.arch }}',
          }
      - name: Prepare collision-safe assembly inputs
        shell: pwsh
        run: |
          $destination = New-Item -ItemType Directory -Force tmp/release-upload
          $artifacts = @(Get-ChildItem release -File | Where-Object { $_.Extension -in @('.exe', '.dmg', '.zip') })
          $expected = if ('${{ matrix.target }}' -eq 'win') { 1 } else { 2 }
          if ($artifacts.Count -ne $expected) { throw "Unexpected final artifact count: $($artifacts.Count)" }
          $artifacts | Copy-Item -Destination $destination
          Copy-Item artifact-provenance.json (Join-Path $destination 'provenance-${{ matrix.target }}-${{ matrix.arch }}.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: 'release-${{ matrix.target }}-${{ matrix.arch }}',
            path: 'tmp/release-upload/*',
            if-no-files-found: error,
          }

  assemble:
    if: ${{ always() && needs.preflight.result == 'success' && needs.unsigned-package.result == 'success' && (inputs.dry_run || needs.package.result == 'success') }}
    needs: [preflight, unsigned-package, package]
    permissions: { contents: read }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ${{ inputs.dry_run && 'unsigned-*' || 'release-*' }}
          path: release-artifacts
          merge-multiple: true
      - run: cp app/assets/THIRD_PARTY_NOTICES.txt release-artifacts/THIRD_PARTY_NOTICES.txt
      - run: node scripts/assemble-release.mjs '${{ needs.preflight.outputs.tag }}' release-artifacts
        env: { TALKING_QUILL_RELEASE_COMMIT: '${{ needs.preflight.outputs.commit }}' }
      - run: node scripts/release-checksums.mjs release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: 'assembled-${{ needs.preflight.outputs.tag }}',
            path: 'release-artifacts/*',
            if-no-files-found: error,
          }
      - name: Prove assembly is non-publishing
        run: echo 'All release assembly stages passed; this read-only job cannot mutate GitHub Releases.'

  attest:
    if: ${{ !inputs.dry_run }}
    needs: [preflight, assemble]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: 'assembled-${{ needs.preflight.outputs.tag }}', path: release-artifacts }
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-artifacts/*

  publish-draft:
    if: ${{ !inputs.dry_run }}
    needs: [preflight, assemble, attest]
    environment: release-signing
    permissions: { contents: write }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: 'assembled-${{ needs.preflight.outputs.tag }}', path: release-artifacts }
      - name: Reject any candidate change before draft mutation
        run: |
          test "$(git rev-parse HEAD^{commit})" = '${{ needs.preflight.outputs.commit }}'
          test "$(git rev-parse '${{ needs.preflight.outputs.tag }}^{commit}')" = '${{ needs.preflight.outputs.commit }}'
          git diff --quiet HEAD -- .
          git diff --cached --quiet HEAD -- .
      - name: Reject an existing release or draft
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh api 'repos/${{ needs.preflight.outputs.repository }}/releases/tags/${{ needs.preflight.outputs.tag }}' >/dev/null 2>&1; then
            echo 'A release or draft already exists; deliberate cleanup is required before retry.' >&2
            exit 1
          fi
      - name: Create exact draft for protected human approval
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create '${{ needs.preflight.outputs.tag }}' release-artifacts/* --repo '${{ needs.preflight.outputs.repository }}' --draft --verify-tag --target '${{ needs.preflight.outputs.commit }}' --title 'Talking Quill ${{ needs.preflight.outputs.tag }}' --notes-file '${{ needs.preflight.outputs.notes_path }}'
      - name: Verify authenticated draft response and exact assets
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p tmp/draft-verification
          gh api 'repos/${{ needs.preflight.outputs.repository }}/releases/tags/${{ needs.preflight.outputs.tag }}' > tmp/draft-verification/response.json
          mkdir -p tmp/draft-verification/downloaded
          gh release download '${{ needs.preflight.outputs.tag }}' --repo '${{ needs.preflight.outputs.repository }}' --dir tmp/draft-verification/downloaded
          node scripts/verify-draft-release.mjs '${{ needs.preflight.outputs.tag }}' '${{ needs.preflight.outputs.commit }}' release-artifacts/release-manifest.json release-artifacts/SHA256SUMS.txt tmp/draft-verification/response.json tmp/draft-verification/downloaded
