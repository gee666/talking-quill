name: Build Windows x64 and ARM64 native setup release candidates

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-x64-arm64-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    runs-on: windows-latest
    timeout-minutes: 150
    outputs:
      release_commit: ${{ steps.source.outputs.commit }}
      release_tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require canonical default-branch dispatch
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = gee666/talking-quill
          test "$GITHUB_REF" = refs/heads/master
      - name: Resolve immutable source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Require clean coordinated release source
        shell: bash
        run: node scripts/release-source-preflight.mjs "$(node -p "'v' + require('./app/package.json').version")"
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fetch-targets
      - run: pnpm validate:unsigned-release
      - name: Install the pinned RustSec scanner
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: pnpm security:gate

  package:
    name: Package and preserve Windows ${{ matrix.arch }} native setup
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            package_script: package:win
            unpacked: win-unpacked
          - arch: arm64
            package_script: package:win:arm64
            unpacked: win-arm64-unpacked
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TALKING_QUILL_REQUIRE_CLEAN_SOURCE: '1'
      TALKING_QUILL_RELEASE_COMMIT: ${{ needs.validate.outputs.release_commit }}
      TALKING_QUILL_RELEASE_TREE: ${{ needs.validate.outputs.release_tree }}
      TALKING_QUILL_PACKAGE_INSPECTION_STRICT: '1'
      TALKING_QUILL_PACKAGE_ARTIFACTS_REQUIRED: native-setup
      TALKING_QUILL_PACKAGE_TARGET: win
      TALKING_QUILL_PACKAGE_ARCH: ${{ matrix.arch }}
      TALKING_QUILL_PACKAGE_MODE: fresh
      TALKING_QUILL_PERSONAL_FRESH_INSTALL: '1'
      TALKING_QUILL_WINDOWS_FRESH_TRUST_ROOT: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD^{commit})" = "${{ needs.validate.outputs.release_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.validate.outputs.release_tree }}"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - name: Require clean source before dependency installation
        shell: pwsh
        run: if ((git status --porcelain --untracked-files=normal).Length -ne 0) { throw 'Package source is not clean.' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fetch-targets
      - run: node scripts/prepare-seven-zip.mjs x64
      # Invoke the app package command directly. It builds and inspects the native setup
      # before any source-test ABI restoration or installed lifecycle work.
      - name: Build explicit public fresh trust-root setup
        shell: pwsh
        run: |
          Get-ChildItem Env: | Where-Object { $_.Name -match '^TALKING_QUILL_(?:MACOS_)?PREDECESSOR_' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          pnpm --filter @talking-quill/app ${{ matrix.package_script }}
      # Fresh trust-root staging has no updater private key or update branch.
      - name: Stage exact Windows fresh payload
        shell: pwsh
        run: node scripts/stage-unsigned-release.mjs win ${{ matrix.arch }}
      - name: Require source immutability after packaging
        shell: pwsh
        run: if ((git status --porcelain --untracked-files=normal).Length -ne 0) { throw 'Packaging modified the release source.' }
      - name: Upload provenance-bound exact native setup smoke input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ matrix.arch }}-exact-native-setup-input
          path: |
            tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}-setup.exe
            tmp/release-upload/provenance-win-${{ matrix.arch }}-setup.json
            tmp/release-upload/THIRD_PARTY_NOTICES.txt
            tmp/release-upload/RELEASE.json
            release/${{ matrix.unpacked }}/**
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke exact Windows ${{ matrix.arch }} native setup on native hardware
    needs: [validate, package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD^{commit})" = "${{ needs.validate.outputs.release_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.validate.outputs.release_tree }}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-${{ matrix.arch }}-exact-native-setup-input
          path: preserved
      - name: Run native interactive cancellation smoke on exact transferred bytes
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem preserved/tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one exact fresh installer for native GUI smoke.' }
          node scripts/run-windows-installer-ui-smoke.mjs --arch ${{ matrix.arch }} --installer $installers[0].FullName --provenance preserved/tmp/release-upload/provenance-win-${{ matrix.arch }}-setup.json --output tmp/windows-installer-ui-smoke-${{ matrix.arch }}.json
          node scripts/windows-installer-ui-evidence.mjs --evidence tmp/windows-installer-ui-smoke-${{ matrix.arch }}.json --installer $installers[0].FullName --provenance preserved/tmp/release-upload/provenance-win-${{ matrix.arch }}-setup.json --arch ${{ matrix.arch }}
      - name: Upload architecture-native GUI smoke evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ matrix.arch }}-native-ui-smoke-evidence
          path: tmp/windows-installer-ui-smoke-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble verified unsigned Windows installers
    needs: [validate, package, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64-exact-native-setup-input
          path: tmp/preserved/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-arm64-exact-native-setup-input
          path: tmp/preserved/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-*-native-ui-smoke-evidence
          path: tmp/smoke-evidence
          merge-multiple: true
      - name: Verify staged provenance and native smoke, then assemble exact bytes
        env:
          TALKING_QUILL_RELEASE_COMMIT: ${{ needs.validate.outputs.release_commit }}
          TALKING_QUILL_RELEASE_TREE: ${{ needs.validate.outputs.release_tree }}
        run: |
          node scripts/assemble-ordinary-unsigned-release.mjs tmp/preserved tmp/smoke-evidence tmp/release-artifacts
          node scripts/release-checksums.mjs tmp/release-artifacts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-native-release-candidates
          path: tmp/release-artifacts/*
          if-no-files-found: error
          retention-days: 14
