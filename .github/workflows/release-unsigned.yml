name: Build Windows x64 and ARM64 native setup release candidates

on:
  workflow_dispatch:
    inputs:
      predecessor_x64_version:
        description: Exact installed x64 predecessor version
        required: true
        type: string
      predecessor_x64_release_build:
        description: Exact x64 predecessor release-build SHA-256
        required: true
        type: string
      predecessor_x64_installer_url:
        description: HTTPS URL for the exact published x64 predecessor native setup installer
        required: true
        type: string
      predecessor_x64_installer_sha256:
        description: Exact published x64 predecessor native setup SHA-256
        required: true
        type: string
      predecessor_x64_gateway_sha256:
        description: Exact x64 predecessor gateway SHA-256
        required: true
        type: string
      predecessor_x64_owner_sha256:
        description: Exact x64 predecessor owner SHA-256
        required: true
        type: string
      predecessor_x64_gateway_url:
        description: HTTPS URL for the exact published x64 predecessor gateway artifact
        required: true
        type: string
      predecessor_x64_owner_url:
        description: HTTPS URL for the exact published x64 predecessor owner artifact
        required: true
        type: string
      predecessor_x64_update_public_key_sha256:
        description: Secondary assertion for the key inspected from the x64 predecessor gateway
        required: true
        type: string
      predecessor_arm64_version:
        description: Exact installed ARM64 predecessor version
        required: true
        type: string
      predecessor_arm64_release_build:
        description: Exact ARM64 predecessor release-build SHA-256
        required: true
        type: string
      predecessor_arm64_installer_url:
        description: HTTPS URL for the exact published ARM64 predecessor native setup installer
        required: true
        type: string
      predecessor_arm64_installer_sha256:
        description: Exact published ARM64 predecessor native setup SHA-256
        required: true
        type: string
      predecessor_arm64_gateway_sha256:
        description: Exact ARM64 predecessor gateway SHA-256
        required: true
        type: string
      predecessor_arm64_owner_sha256:
        description: Exact ARM64 predecessor owner SHA-256
        required: true
        type: string
      predecessor_arm64_gateway_url:
        description: HTTPS URL for the exact published ARM64 predecessor gateway artifact
        required: true
        type: string
      predecessor_arm64_owner_url:
        description: HTTPS URL for the exact published ARM64 predecessor owner artifact
        required: true
        type: string
      predecessor_arm64_update_public_key_sha256:
        description: Secondary assertion for the key inspected from the ARM64 predecessor gateway
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-x64-arm64-release
  cancel-in-progress: false

jobs:
  release-controls:
    name: Verify protected release controls
    runs-on: ubuntu-latest
    environment: release-trust
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      - name: Fail closed unless immutable publication controls exist
        env:
          RELEASE_CONTROL_TOKEN: ${{ secrets.RELEASE_CONTROL_TOKEN }}
          RELEASE_TAG: v0.0.69
        run: node scripts/release-control-preflight.mjs

  validate:
    needs: release-controls
    name: Validate source
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      release_commit: ${{ steps.source.outputs.commit }}
      release_tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Require clean coordinated release source
        shell: bash
        run: node scripts/release-source-preflight.mjs "$(node -p "'v' + require('./app/package.json').version")"
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fetch-targets
      - run: pnpm validate:unsigned-release
      - name: Install the pinned RustSec scanner
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: pnpm security:gate

  package:
    name: Package and preserve Windows ${{ matrix.arch }} native setup
    needs: validate
    runs-on: windows-latest
    environment: release-signing
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            package_script: package:win
            unpacked: win-unpacked
          - arch: arm64
            package_script: package:win:arm64
            unpacked: win-arm64-unpacked
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TALKING_QUILL_REQUIRE_CLEAN_SOURCE: '1'
      TALKING_QUILL_RELEASE_COMMIT: ${{ needs.validate.outputs.release_commit }}
      TALKING_QUILL_RELEASE_TREE: ${{ needs.validate.outputs.release_tree }}
      TALKING_QUILL_PACKAGE_INSPECTION_STRICT: '1'
      TALKING_QUILL_PACKAGE_ARTIFACTS_REQUIRED: native-setup
      TALKING_QUILL_PACKAGE_TARGET: win
      TALKING_QUILL_PACKAGE_ARCH: ${{ matrix.arch }}
      TALKING_QUILL_PACKAGE_MODE: update
      TALKING_QUILL_PREDECESSOR_VERSION: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_version || inputs.predecessor_arm64_version }}
      TALKING_QUILL_PREDECESSOR_RELEASE_BUILD: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_release_build || inputs.predecessor_arm64_release_build }}
      TALKING_QUILL_PREDECESSOR_GATEWAY_SHA256: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_gateway_sha256 || inputs.predecessor_arm64_gateway_sha256 }}
      TALKING_QUILL_PREDECESSOR_OWNER_SHA256: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_owner_sha256 || inputs.predecessor_arm64_owner_sha256 }}
      TALKING_QUILL_PREDECESSOR_GATEWAY_URL: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_gateway_url || inputs.predecessor_arm64_gateway_url }}
      TALKING_QUILL_PREDECESSOR_OWNER_URL: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_owner_url || inputs.predecessor_arm64_owner_url }}
      TALKING_QUILL_PREDECESSOR_UPDATE_PUBLIC_KEY_SHA256: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_update_public_key_sha256 || inputs.predecessor_arm64_update_public_key_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD^{commit})" = "${{ needs.validate.outputs.release_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.validate.outputs.release_tree }}"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - name: Require clean source before dependency installation
        shell: pwsh
        run: if ((git status --porcelain --untracked-files=normal).Length -ne 0) { throw 'Package source is not clean.' }
      - run: pnpm install --frozen-lockfile
      - name: Inspect exact predecessor roles
        shell: pwsh
        run: |
          if (-not $env:TALKING_QUILL_PREDECESSOR_GATEWAY_URL.StartsWith('https://') -or -not $env:TALKING_QUILL_PREDECESSOR_OWNER_URL.StartsWith('https://')) { throw 'Predecessor role URLs must use HTTPS.' }
          New-Item -ItemType Directory -Force tmp | Out-Null
          $gateway = (Resolve-Path tmp).Path + '\predecessor-gateway-${{ matrix.arch }}.exe'
          $owner = (Resolve-Path tmp).Path + '\predecessor-owner-${{ matrix.arch }}.exe'
          Invoke-WebRequest -Uri $env:TALKING_QUILL_PREDECESSOR_GATEWAY_URL -OutFile $gateway
          Invoke-WebRequest -Uri $env:TALKING_QUILL_PREDECESSOR_OWNER_URL -OutFile $owner
          $env:TALKING_QUILL_PREDECESSOR_GATEWAY_PATH = $gateway
          $env:TALKING_QUILL_PREDECESSOR_OWNER_PATH = $owner
          node -e "import('./scripts/release-package-metadata.mjs').then(({readPackagePredecessor})=>{const fs=require('fs');readPackagePredecessor(process.env,'win','${{ matrix.arch }}');fs.appendFileSync(process.env.GITHUB_ENV,'TALKING_QUILL_PREDECESSOR_GATEWAY_PATH='+process.env.TALKING_QUILL_PREDECESSOR_GATEWAY_PATH+'\nTALKING_QUILL_PREDECESSOR_OWNER_PATH='+process.env.TALKING_QUILL_PREDECESSOR_OWNER_PATH+'\n')})"
      - run: node scripts/prepare-seven-zip.mjs x64
      # Invoke the app package command directly. It builds and inspects the native setup
      # before any source-test ABI restoration or installed lifecycle work.
      - name: Build explicit public fresh setup
        shell: bash
        run: |
          TALKING_QUILL_PACKAGE_MODE=fresh pnpm --filter @talking-quill/app ${{ matrix.package_script }}
          cp artifact-provenance.json tmp/fresh-provenance-${{ matrix.arch }}.json
      - name: Build explicit predecessor-bound update
        run: pnpm --filter @talking-quill/app ${{ matrix.package_script }}
      # Canonical staging binds the exact installer bytes to the two-role
      # talkingQuillRelease identity and copies the matching provenance.
      - name: Authorize updater metadata and stage exact payload
        env:
          TALKING_QUILL_WINDOWS_UPDATE_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.TALKING_QUILL_WINDOWS_UPDATE_SIGNING_KEY_PKCS8_BASE64 }}
          TALKING_QUILL_FRESH_PROVENANCE_PATH: tmp/fresh-provenance-${{ matrix.arch }}.json
        run: node scripts/stage-unsigned-release.mjs win ${{ matrix.arch }}
      # Validate the exact staged producer inventory and create the manifest
      # consumed by publication before any artifact upload or checksum pass.
      - name: Assemble the staged producer inventory
        shell: bash
        run: |
          set -euo pipefail
          tag="$(node -p "'v' + require('./app/package.json').version")"
          node scripts/assemble-release.mjs "$tag" tmp/release-upload
      - name: Generate non-promotable authenticated lifecycle fault artifacts
        shell: bash
        run: |
          set -euo pipefail
          TALKING_QUILL_WINDOWS_INSTALLED_ACCEPTANCE_BUILD=1 node scripts/build-windows-acceptance-fault-setup.mjs ${{ matrix.arch }}
          mkdir -p tmp/windows-fault-artifacts/${{ matrix.arch }} tmp/windows-terminal-fault-artifacts/${{ matrix.arch }}
          for phase in staged prepared predecessorMoved publishing publishedBeforePersist published registered committed legacyRetiring legacyRetired; do
            TALKING_QUILL_WINDOWS_INSTALLED_ACCEPTANCE_BUILD=1 TALKING_QUILL_PACKAGE_MODE=repair TALKING_QUILL_NATIVE_FAULT_PHASE="$phase" node scripts/pack-windows-native.mjs ${{ matrix.arch }} release
            mv release/Talking-Quill-*-repair-"$phase".exe tmp/windows-fault-artifacts/${{ matrix.arch }}/
          done
          TALKING_QUILL_WINDOWS_INSTALLED_ACCEPTANCE_BUILD=1 TALKING_QUILL_PACKAGE_MODE=repair TALKING_QUILL_NATIVE_FAULT_PHASE=terminalAcceptance node scripts/pack-windows-native.mjs ${{ matrix.arch }} release
          mv release/Talking-Quill-*-repair-terminalAcceptance.exe tmp/windows-terminal-fault-artifacts/${{ matrix.arch }}/
          # Fault-bearing packages are diagnostics only; successful repair is exercised with
          # an exact copy of the installed production image in the lifecycle job.
      # Transfer the provenance-bound bytes to the architecture-native smoke
      # runner. No evidence exists until that runner exercises these exact bytes.
      - name: Upload provenance-bound exact native setup smoke input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ matrix.arch }}-exact-native-setup-input
          path: |
            tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}-setup.exe
            tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}-update.exe
            tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}-update.exe.blockmap
            tmp/release-upload/latest-${{ matrix.arch }}.yml
            tmp/release-upload/release-identity-win-${{ matrix.arch }}.json
            tmp/release-upload/provenance-win-${{ matrix.arch }}-setup.json
            tmp/release-upload/provenance-win-${{ matrix.arch }}-update.json
            tmp/release-upload/THIRD_PARTY_NOTICES.txt
            tmp/release-upload/release-manifest.json
            release/${{ matrix.unpacked }}/**
            tmp/windows-fault-artifacts/${{ matrix.arch }}/*.exe
            tmp/windows-terminal-fault-artifacts/${{ matrix.arch }}/*.exe
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke exact Windows ${{ matrix.arch }} native setup on native hardware
    needs: [validate, package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD^{commit})" = "${{ needs.validate.outputs.release_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.validate.outputs.release_tree }}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-${{ matrix.arch }}-exact-native-setup-input
          path: preserved
      - name: Run native interactive cancellation smoke on exact transferred bytes
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem preserved/tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one exact fresh installer for native GUI smoke.' }
          node scripts/run-windows-installer-ui-smoke.mjs --arch ${{ matrix.arch }} --installer $installers[0].FullName --provenance preserved/tmp/release-upload/provenance-win-${{ matrix.arch }}-setup.json --output tmp/windows-installer-ui-smoke-${{ matrix.arch }}.json
          node scripts/windows-installer-ui-evidence.mjs --evidence tmp/windows-installer-ui-smoke-${{ matrix.arch }}.json --installer $installers[0].FullName --provenance preserved/tmp/release-upload/provenance-win-${{ matrix.arch }}-setup.json --arch ${{ matrix.arch }}
      - name: Upload architecture-native GUI smoke evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ matrix.arch }}-native-ui-smoke-evidence
          path: tmp/windows-installer-ui-smoke-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  lifecycle:
    name: Verify preserved Windows ${{ matrix.arch }} lifecycle
    needs: [validate, package, smoke]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            unpacked: win-unpacked
          - arch: arm64
            runner: windows-11-arm
            unpacked: win-arm64-unpacked
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD^{commit})" = "${{ needs.validate.outputs.release_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.validate.outputs.release_tree }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-${{ matrix.arch }}-exact-native-setup-input
          path: preserved
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-${{ matrix.arch }}-native-ui-smoke-evidence
          path: smoke-evidence
      - name: Revalidate mandatory installer GUI smoke evidence before installation
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem preserved/tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one exact fresh installer for GUI smoke validation.' }
          node scripts/windows-installer-ui-evidence.mjs --evidence smoke-evidence/windows-installer-ui-smoke-${{ matrix.arch }}.json --installer $installers[0].FullName --provenance preserved/tmp/release-upload/provenance-win-${{ matrix.arch }}-setup.json --arch ${{ matrix.arch }}
      - run: node scripts/windows-package-lifecycle.mjs --arch ${{ matrix.arch }} --mode unpacked --root preserved/release/${{ matrix.unpacked }}
      - name: Install exact authenticated predecessor, then update candidate
        shell: pwsh
        env:
          PREDECESSOR_INSTALLER_URL: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_installer_url || inputs.predecessor_arm64_installer_url }}
          PREDECESSOR_INSTALLER_SHA256: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_installer_sha256 || inputs.predecessor_arm64_installer_sha256 }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $env:PREDECESSOR_INSTALLER_URL.StartsWith('https://') -or $env:PREDECESSOR_INSTALLER_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Predecessor installer identity is invalid.' }
          $predecessor = Join-Path $env:RUNNER_TEMP 'talking-quill-exact-predecessor.exe'
          Invoke-WebRequest -Uri $env:PREDECESSOR_INSTALLER_URL -OutFile $predecessor
          $actual = (Get-FileHash -LiteralPath $predecessor -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:PREDECESSOR_INSTALLER_SHA256) { throw 'Predecessor installer SHA-256 mismatch.' }
          $previous = Start-Process -FilePath $predecessor -ArgumentList '/S' -Wait -PassThru
          if ($previous.ExitCode -ne 0) { throw "Predecessor native setup install failed: $($previous.ExitCode)" }
          $installers = @(Get-ChildItem preserved/tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}-update.exe)
          if ($installers.Count -ne 1) { throw "Expected one preserved ${{ matrix.arch }} update installer, found $($installers.Count)" }
          $identity = Get-Content -LiteralPath preserved/tmp/release-upload/release-identity-win-${{ matrix.arch }}.json -Raw | ConvertFrom-Json
          $candidateHash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $request = @{ version = 2; installerPath = $installers[0].FullName; sha256 = $candidateHash; candidate = $identity } | ConvertTo-Json -Depth 20 -Compress
          $bootstrap = '--windows-update-bootstrap-v2=' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($request))
          $helper = "$env:ProgramFiles\Talking Quill\resources\helper\talking-quill-helper.exe"
          $candidate = Start-Process -FilePath $helper -ArgumentList $bootstrap -PassThru
          $updateInterrupted = $false
          $killDeadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $killDeadline) {
            $transactionPath = "$env:ProgramFiles\.Talking Quill.native-transaction-v2.json"
            if (Test-Path -LiteralPath $transactionPath) {
              $state = Get-Content -LiteralPath $transactionPath -Raw | ConvertFrom-Json
              if ($state.phase -eq 'staging') {
                $worker = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like '*\.Talking Quill.update-bootstrap-*\verified-update-installer.exe' } | Sort-Object CreationDate -Descending | Select-Object -First 1)
                if ($worker.Count -eq 1) { Stop-Process -Id $worker[0].ProcessId -Force; $updateInterrupted = $true; break }
              }
            }
            Start-Sleep -Milliseconds 2
          }
          $candidate.WaitForExit()
          if (-not $updateInterrupted) { throw 'Production update mutation was not interrupted.' }
          $resume = @(Get-ChildItem "$env:ProgramData\.Talking Quill.update-bootstrap-*\talking-quill-update-bootstrap.exe")
          if ($resume.Count -ne 1) { throw 'Protected staged predecessor recovery owner is not exact.' }
          $generation = Get-Content -LiteralPath (Join-Path $resume[0].DirectoryName 'active-recovery-generation-v1') -Raw
          if ($generation -notmatch '^[0-9a-f]{32}$') { throw 'Protected update recovery generation is invalid.' }
          $retryName = "Talking Quill Update Recovery $generation"
          $retry = Get-ItemPropertyValue -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name $retryName
          if ($retry -notlike "*--windows-update-resume-v2=$generation*") { throw 'Persistent visible recovery command is missing or mismatched.' }
          $recoveryLauncher = "$env:ProgramData\Talking Quill Update Recovery\talking-quill-update-recovery-launcher.exe"
          if (-not (Test-Path -LiteralPath $recoveryLauncher)) { throw 'Medium-integrity recovery launcher is missing.' }
          $installedHelper = "$env:ProgramFiles\Talking Quill\resources\helper\talking-quill-helper.exe"
          $ownerInstall = Start-Process -FilePath $installedHelper -ArgumentList '--windows-update-relaunch-owner-install-v1' -Wait -PassThru
          if ($ownerInstall.ExitCode -ne 0) { throw "Machine login recovery owner installation failed: $($ownerInstall.ExitCode)" }
          $machineRelaunch = Get-ItemPropertyValue -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Talking Quill Update Relaunch'
          if ($machineRelaunch -cne ('"' + $recoveryLauncher + '" --windows-update-relaunch-owner-v1')) { throw 'Stable machine login recovery owner is not exact.' }
          $loginRecovery = Start-Process -FilePath $recoveryLauncher -ArgumentList '--windows-update-relaunch-owner-v1' -Wait -PassThru
          if ($loginRecovery.ExitCode -ne 0) { throw "Actual launcher login recovery failed: $($loginRecovery.ExitCode)" }
          $resumed = Start-Process -FilePath $recoveryLauncher -ArgumentList "--windows-update-resume-v2=$generation" -Wait -PassThru
          if ($resumed.ExitCode -ne 0) { throw "Authenticated predecessor snapshot resume failed: $($resumed.ExitCode)" }
          if ($null -ne (Get-ItemPropertyValue -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name $retryName -ErrorAction SilentlyContinue)) { throw 'Successful recovery retained its persistent retry command.' }
          $expectedDigest = $identity.releaseBuildDigest
          $deadline = (Get-Date).AddMinutes(3)
          do {
            $installedIdentityPath = "$env:ProgramFiles\Talking Quill\resources\keyboard-owner-release-v1.json"
            $installedDigest = if (Test-Path -LiteralPath $installedIdentityPath) { (Get-Content -LiteralPath $installedIdentityPath -Raw | ConvertFrom-Json).releaseBuildDigest } else { $null }
            if ($installedDigest -ceq $expectedDigest) { break }
            if ((Get-Date) -ge $deadline) { throw 'Authenticated predecessor update did not commit before timeout.' }
            Start-Sleep -Milliseconds 250
          } while ($true)
          node scripts/windows-package-lifecycle.mjs --arch ${{ matrix.arch }} --mode installed --root "$env:ProgramFiles\Talking Quill"
          $faultRoot = 'preserved/tmp/windows-fault-artifacts/${{ matrix.arch }}'
          $productionRepair = Join-Path $env:RUNNER_TEMP 'talking-quill-production-repair.exe'
          Copy-Item -LiteralPath "$env:ProgramFiles\Talking Quill\Uninstall Talking Quill.exe" -Destination $productionRepair
          $setupProbe = @(Get-ChildItem preserved/tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}-setup.exe)
          if ($setupProbe.Count -ne 1) { throw 'Expected one production fresh setup recovery probe.' }
          $faultEvidence = @()
          foreach ($fault in @(Get-ChildItem $faultRoot/Talking-Quill-*-repair-*.exe | Sort-Object Name)) {
            $crash = Start-Process -FilePath $fault.FullName -ArgumentList '/S' -Wait -PassThru
            if ($crash.ExitCode -ne 197) { throw "Fault lifecycle did not terminate at its authenticated seam: $($fault.Name)" }
            # Kill the real production recovery worker after its durable recovery intent appears,
            # then rerun the same production package to prove restart idempotence.
            $firstRecovery = Start-Process -FilePath $setupProbe[0].FullName -ArgumentList '/S' -PassThru
            $recoveryInterrupted = $false
            $recoveryDeadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $recoveryDeadline) {
              if (Test-Path -LiteralPath "$env:ProgramFiles\.Talking Quill.native-transaction-v2.json") {
                $recoveryState = Get-Content -LiteralPath "$env:ProgramFiles\.Talking Quill.native-transaction-v2.json" -Raw | ConvertFrom-Json
                if ($recoveryState.phase -like 'recovering-*') {
                  $worker = @(Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $firstRecovery.Id -and $_.ExecutablePath -ceq $setupProbe[0].FullName } | Sort-Object CreationDate -Descending | Select-Object -First 1)
                  if ($worker.Count -eq 1) { Stop-Process -Id $worker[0].ProcessId -Force; $recoveryInterrupted = $true; break }
                }
              }
              Start-Sleep -Milliseconds 2
            }
            $firstRecovery.WaitForExit()
            if (-not $recoveryInterrupted) { throw "Production recovery mutation was not interrupted: $($fault.Name)" }
            $recovery = Start-Process -FilePath $setupProbe[0].FullName -ArgumentList '/S' -Wait -PassThru
            if ($recovery.ExitCode -ne 78) { throw "Production recovery probe did not reject after recovery: $($fault.Name) / $($recovery.ExitCode)" }
            $transaction = "$env:ProgramFiles\.Talking Quill.native-transaction-v2.json"
            if (Test-Path -LiteralPath $transaction) { throw "Recovery was not terminal before repair: $($fault.Name)" }
            $recoveredIdentity = Get-Content -LiteralPath "$env:ProgramFiles\Talking Quill\resources\keyboard-owner-release-v1.json" -Raw | ConvertFrom-Json
            if ($recoveredIdentity.releaseBuildDigest -cne $expectedDigest) { throw "Recovered identity was neither the exact candidate nor an accepted terminal topology: $($fault.Name)" }
            $appPath = (Get-ItemProperty -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\App Paths\Talking Quill.exe' -Name '(default)').'(default)'
            $quiet = (Get-ItemProperty -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Talking Quill' -Name QuietUninstallString).QuietUninstallString
            $legacyServiceAbsent = $null -eq (Get-Service -Name TalkingQuillKeyboardAuthority -ErrorAction SilentlyContinue)
            $nativeErrorPreference = $PSNativeCommandUseErrorActionPreference
            $PSNativeCommandUseErrorActionPreference = $false
            & "$env:WINDIR\System32\schtasks.exe" /Query /TN TalkingQuillKeyboardAuthority *> $null
            $taskQueryExit = $LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
            if ($taskQueryExit -notin @(0, 1)) { throw "Legacy task query failed: $taskQueryExit" }
            $legacyTaskAbsent = $taskQueryExit -eq 1
            if ($appPath -cne "$env:ProgramFiles\Talking Quill\Talking Quill.exe" -or $quiet -cne ('"' + "$env:ProgramFiles\Talking Quill Maintenance.exe" + '" /S') -or -not $legacyServiceAbsent -or -not $legacyTaskAbsent) { throw "Recovered registrations or legacy authority are invalid: $($fault.Name)" }
            $faultEvidence += @{ fault = $fault.Name; crashExitCode = 197; recoveryExitCode = 78; recoveredReleaseBuildDigest = $recoveredIdentity.releaseBuildDigest; inspectedBeforeRepair = $true; productionRecoveryInterrupted = $recoveryInterrupted; appPathExact = $true; quietUninstallExact = $true; legacyServiceAbsent = $true; legacyTaskAbsent = $true }
            $postRecoveryRepair = Start-Process -FilePath $productionRepair -ArgumentList '/S' -Wait -PassThru
            if ($postRecoveryRepair.ExitCode -ne 0) { throw "Fault lifecycle repair failed: $($fault.Name)" }
            node scripts/windows-package-lifecycle.mjs --arch ${{ matrix.arch }} --mode installed --root "$env:ProgramFiles\Talking Quill"
          }
          @{ schemaVersion = 1; architecture = '${{ matrix.arch }}'; sourceCommit = '${{ needs.validate.outputs.release_commit }}'; sourceTree = '${{ needs.validate.outputs.release_tree }}'; productionUpdateInterrupted = $updateInterrupted; candidateSha256 = $candidateHash; releaseBuildDigest = $expectedDigest; faults = $faultEvidence; passed = $true } | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath tmp/windows-installer-fault-recovery-${{ matrix.arch }}.json -Encoding utf8
          $framework = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319'
          & (Join-Path $framework 'csc.exe') /nologo /r:System.Management.dll /out:tmp/windows-installer-success-observer.exe scripts/windows-installer-success-observer.cs
          if ($LASTEXITCODE -ne 0) { throw 'Successful lifecycle observer compilation failed.' }
          $repairHash = (Get-FileHash -LiteralPath $productionRepair -Algorithm SHA256).Hash.ToLowerInvariant()
          & tmp/windows-installer-success-observer.exe $productionRepair tmp/windows-installer-success-${{ matrix.arch }}.json 180000 ${{ matrix.arch }} '${{ needs.validate.outputs.release_commit }}' '${{ needs.validate.outputs.release_tree }}' update $repairHash
          if ($LASTEXITCODE -ne 0) { throw 'Successful authenticated repair observation failed.' }
          $uninstallKey = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Talking Quill'
          $quiet = (Get-ItemProperty -LiteralPath $uninstallKey -Name QuietUninstallString).QuietUninstallString
          if ($quiet -cne ('"' + "$env:ProgramFiles\Talking Quill Maintenance.exe" + '" /S')) { throw 'QuietUninstallString is not exact.' }
          foreach ($staleSchema in @(1, 2)) {
            $staleGeneration = if ($staleSchema -eq 1) { 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' } else { 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }
            $staleRoot = Join-Path $env:LOCALAPPDATA "Talking Quill\Windows Update Recovery\$staleGeneration"
            New-Item -ItemType Directory -Path $staleRoot -Force | Out-Null
            @{ schemaVersion = $staleSchema; generation = $staleGeneration; request = '--windows-update-bootstrap-v2=dGVzdA=='; nonce = ('11' * 16); sourceVersion = '0.0.69'; targetVersion = '0.0.70'; phase = 'armed'; completedVersion = $null } | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $staleRoot 'relaunch-record-v1.json') -Encoding utf8
            New-ItemProperty -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name "Talking Quill Update Relaunch $staleGeneration" -Value ('"' + $recoveryLauncher + '" --windows-update-relaunch-v1=' + $staleGeneration) -PropertyType String -Force | Out-Null
          }
          $terminalAcceptanceSetups = @(Get-ChildItem 'preserved/tmp/windows-terminal-fault-artifacts/${{ matrix.arch }}/Talking-Quill-*-repair-terminalAcceptance.exe')
          if ($terminalAcceptanceSetups.Count -ne 1) { throw 'Expected one isolated nonpromotable terminal acceptance setup.' }
          $terminalAcceptanceSetup = $terminalAcceptanceSetups[0].FullName
          $terminalAcceptanceHash = (Get-FileHash -LiteralPath $terminalAcceptanceSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($terminalAcceptanceHash -ceq $repairHash) { throw 'Terminal acceptance setup was not built separately from production.' }
          $recoveryLauncherHash = (Get-FileHash -LiteralPath $recoveryLauncher -Algorithm SHA256).Hash.ToLowerInvariant()
          $terminalFaultEvidence = @()
          $terminalFaults = @(
            'pre-CreateService',
            'post-service-pre-record',
            'post-record-pre-start',
            'failure-action-restart',
            'service-stopped-pre-DeleteService',
            'post-delete-pre-image-removal',
            'reboot-pending-delete',
            'pre-maintenance-deletion-ownership',
            'post-maintenance-deletion-ownership',
            'post-final-launcher-ownership',
            'post-uninstall-unregister',
            'post-journal-removal',
            'post-root-tombstone-rename',
            'post-tombstone-content-removal',
            'post-tombstone-marker-removal',
            'post-tombstone-removal',
            'post-maintenance-posix-delete',
            'post-final-launcher-posix-delete',
            'pre-machine-relaunch-owner-clear',
            'post-machine-relaunch-owner-clear'
          )
          foreach ($terminalFault in $terminalFaults) {
            $baselineUninstaller = "$env:ProgramFiles\Talking Quill\Uninstall Talking Quill.exe"
            if (-not (Test-Path -LiteralPath $baselineUninstaller) -or (Get-FileHash -LiteralPath $baselineUninstaller -Algorithm SHA256).Hash.ToLowerInvariant() -cne $repairHash) { throw "Terminal scenario did not start from the exact production baseline at $terminalFault" }
            if (@(Get-Service -Name 'TalkingQuillTerminalCleanup-*' -ErrorAction SilentlyContinue).Count -ne 0 -or (Test-Path -LiteralPath "$env:ProgramData\Talking Quill Update Recovery\terminal-uninstall-record-v1.json")) { throw "Terminal scenario inherited active cleanup authority at $terminalFault" }
            $acceptanceInstall = Start-Process -FilePath $terminalAcceptanceSetup -ArgumentList '/S' -Wait -PassThru
            if ($acceptanceInstall.ExitCode -ne 0) { throw "Isolated terminal acceptance setup failed at $terminalFault: $($acceptanceInstall.ExitCode)" }
            $installedAcceptanceUninstaller = "$env:ProgramFiles\Talking Quill\Uninstall Talking Quill.exe"
            if ((Get-FileHash -LiteralPath $installedAcceptanceUninstaller -Algorithm SHA256).Hash.ToLowerInvariant() -cne $terminalAcceptanceHash) { throw "Installed terminal acceptance uninstaller hash mismatch at $terminalFault" }
            Remove-Item Env:TQ_TERMINAL_FAULT -ErrorAction SilentlyContinue
            New-Item -Path 'HKLM:\Software\Talking Quill\AcceptanceTerminalFault' -Force | Out-Null
            New-ItemProperty -LiteralPath 'HKLM:\Software\Talking Quill\AcceptanceTerminalFault' -Name Phase -Value $terminalFault -PropertyType String -Force | Out-Null
            $faultedUninstall = Start-Process -FilePath "$env:ProgramFiles\Talking Quill\Uninstall Talking Quill.exe" -ArgumentList '/S' -Wait -PassThru
            Remove-Item Env:TQ_TERMINAL_FAULT -ErrorAction SilentlyContinue
            if ($terminalFault -cne 'failure-action-restart') {
              $maintenancePath = "$env:ProgramFiles\Talking Quill Maintenance.exe"
              $maintenanceQuiet = Get-ItemPropertyValue -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Talking Quill' -Name QuietUninstallString -ErrorAction SilentlyContinue
              $maintenanceHash = if (Test-Path -LiteralPath $maintenancePath) { (Get-FileHash -LiteralPath $maintenancePath -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null }
              $callableMaintenance = ($maintenanceQuiet -ceq ('"' + $maintenancePath + '" /S')) -and ($maintenanceHash -ceq $terminalAcceptanceHash)
              $terminalServiceCandidates = @(Get-CimInstance Win32_Service -Filter "Name LIKE 'TalkingQuillTerminalCleanup-%'" -ErrorAction SilentlyContinue | Where-Object { $_.StartMode -ceq 'Auto' -and $_.StartName -ceq 'LocalSystem' -and $_.PathName -cmatch '^"(.+\.Talking Quill Terminal Cleanup-[0-9a-f]{32}\.exe)" /TQ-TERMINAL-SERVICE=[0-9a-f]{32}$' })
              $autoTerminalService = $terminalServiceCandidates.Count -eq 1
              if ($autoTerminalService) {
                $serviceImage = [regex]::Match($terminalServiceCandidates[0].PathName, '^"(.+\.exe)"').Groups[1].Value
                $autoTerminalService = (Test-Path -LiteralPath $serviceImage) -and ((Get-FileHash -LiteralPath $serviceImage -Algorithm SHA256).Hash.ToLowerInvariant() -ceq $terminalAcceptanceHash)
              }
              $machineOwnerCommand = Get-ItemPropertyValue -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Talking Quill Update Relaunch' -ErrorAction SilentlyContinue
              $machineOwnerMatch = if ($null -ne $machineOwnerCommand) { [regex]::Match($machineOwnerCommand, '^"(.+\.exe)" --windows-update-relaunch-owner-v1$') } else { $null }
              $authenticatedMachineOwner = $null -ne $machineOwnerMatch -and $machineOwnerMatch.Success -and (Test-Path -LiteralPath $machineOwnerMatch.Groups[1].Value) -and ((Get-FileHash -LiteralPath $machineOwnerMatch.Groups[1].Value -Algorithm SHA256).Hash.ToLowerInvariant() -ceq $recoveryLauncherHash)
              $terminalWorkCommitted = $terminalFault -in @('post-final-launcher-posix-delete', 'pre-machine-relaunch-owner-clear', 'post-machine-relaunch-owner-clear')
              if (-not $callableMaintenance -and -not $autoTerminalService -and -not $authenticatedMachineOwner -and -not $terminalWorkCommitted) { throw "Terminal fault retained no authenticated callable authority at $terminalFault" }
            }
            $recoveredBySetup = $false
            if ($terminalFault -ceq 'failure-action-restart') {
              if ($faultedUninstall.ExitCode -ne 0) { throw "Terminal service failure action did not recover: $($faultedUninstall.ExitCode)" }
            } elseif ($terminalFault -ceq 'reboot-pending-delete') {
              if ($faultedUninstall.ExitCode -eq 0) { throw 'Reboot-pending terminal image deletion unexpectedly completed.' }
              $pendingRename = (Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction Stop).PendingFileRenameOperations
              if (-not (@($pendingRename) -match 'Talking Quill Terminal Cleanup-[0-9a-f]{32}\.exe')) { throw 'Reboot-pending terminal image deletion was not recorded.' }
              Get-ChildItem -LiteralPath $env:ProgramData -Force | Where-Object Name -Like '.Talking Quill Terminal Cleanup-*.exe' | Remove-Item -Force
              $retainedPendingRename = [System.Collections.Generic.List[string]]::new()
              for ($pendingIndex = 0; $pendingIndex -lt $pendingRename.Count; $pendingIndex += 2) {
                $pendingSource = [string]$pendingRename[$pendingIndex]
                $pendingDestination = if ($pendingIndex + 1 -lt $pendingRename.Count) { [string]$pendingRename[$pendingIndex + 1] } else { throw 'Pending rename data had an incomplete pair.' }
                if ($pendingSource -notmatch 'Talking Quill Terminal Cleanup-[0-9a-f]{32}\.exe$') {
                  $retainedPendingRename.Add($pendingSource)
                  $retainedPendingRename.Add($pendingDestination)
                }
              }
              Set-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -Value $retainedPendingRename.ToArray() -Type MultiString
              $resumeOwnerCommand = Get-ItemPropertyValue -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Talking Quill Update Relaunch' -ErrorAction SilentlyContinue
              $resumeOwnerPath = if ($null -ne $resumeOwnerCommand) { [regex]::Match($resumeOwnerCommand, '^"(.+\.exe)" --windows-update-relaunch-owner-v1$').Groups[1].Value } else { $null }
              $terminalResume = if ($null -ne $resumeOwnerPath -and (Test-Path -LiteralPath $resumeOwnerPath)) { Start-Process -FilePath $resumeOwnerPath -ArgumentList '--windows-update-relaunch-owner-v1' -Wait -PassThru } else { Start-Process -FilePath $productionRepair -ArgumentList '/S' -Wait -PassThru }
              if ($terminalResume.ExitCode -ne 0) { throw "Pending-delete terminal owner recovery failed: $($terminalResume.ExitCode)" }
            } else {
              if ($faultedUninstall.ExitCode -ne 197) { throw "Terminal fault did not interrupt at $terminalFault: $($faultedUninstall.ExitCode)" }
              $resumeOwnerCommand = Get-ItemPropertyValue -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Talking Quill Update Relaunch' -ErrorAction SilentlyContinue
              $resumeOwnerPath = if ($null -ne $resumeOwnerCommand) { [regex]::Match($resumeOwnerCommand, '^"(.+\.exe)" --windows-update-relaunch-owner-v1$').Groups[1].Value } else { $null }
              if ($terminalFault -cne 'post-machine-relaunch-owner-clear') {
                if ($null -eq $resumeOwnerPath -or -not (Test-Path -LiteralPath $resumeOwnerPath)) { throw "Terminal fault lost its machine recovery owner at $terminalFault" }
                $terminalResume = Start-Process -FilePath $resumeOwnerPath -ArgumentList '--windows-update-relaunch-owner-v1' -Wait -PassThru
                if ($terminalResume.ExitCode -ne 0) { throw "Terminal owner recovery failed at $terminalFault: $($terminalResume.ExitCode)" }
              }
            }
            $terminalRecoveryDeadline = (Get-Date).AddSeconds(240)
            do {
              $terminalMaintenanceRemains = -not $recoveredBySetup -and (Test-Path -LiteralPath "$env:ProgramFiles\Talking Quill Maintenance.exe")
              $pendingTerminalState = @((Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue).PendingFileRenameOperations)
              $terminalTombstonesRemain = @(Get-ChildItem -LiteralPath $env:ProgramData -Force | Where-Object Name -Like '.Talking Quill.recovery-tombstone-*' | Where-Object { @($pendingTerminalState) -notcontains ('\??\' + $_.FullName) }).Count -ne 0
              $terminalRunRemains = $null -ne (Get-ItemPropertyValue -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Talking Quill Update Relaunch' -ErrorAction SilentlyContinue)
              if (-not $terminalMaintenanceRemains -and -not $terminalTombstonesRemain -and -not $terminalRunRemains) { break }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $terminalRecoveryDeadline)
            if ($terminalMaintenanceRemains -or $terminalTombstonesRemain -or $terminalRunRemains) { throw "Terminal owner recovery timed out at $terminalFault" }
            if (@(Get-Service -Name 'TalkingQuillTerminalCleanup-*' -ErrorAction SilentlyContinue).Count -ne 0) { throw "Terminal service remained after $terminalFault" }
            if (@(Get-ChildItem -LiteralPath $env:ProgramData -Force | Where-Object Name -Like '.Talking Quill Terminal Cleanup-*.exe').Count -ne 0) { throw "Terminal image remained after $terminalFault" }
            $terminalFaultEvidence += @{ phase = $terminalFault; acceptanceSetupSha256 = $terminalAcceptanceHash; installedUninstallerSha256 = $terminalAcceptanceHash; isolated = $true; recovered = $true }
            if (-not $recoveredBySetup) {
              $terminalRepair = Start-Process -FilePath $productionRepair -ArgumentList '/S' -Wait -PassThru
              if ($terminalRepair.ExitCode -ne 0) { throw "Terminal fault reinstall failed at $terminalFault: $($terminalRepair.ExitCode)" }
            }
          }
          Remove-Item Env:TQ_TERMINAL_FAULT -ErrorAction SilentlyContinue
          $uninstall = Start-Process -FilePath "$env:ProgramFiles\Talking Quill\Uninstall Talking Quill.exe" -ArgumentList '/S' -PassThru
          $normalRelocated = $false
          $terminalOwnerObserved = $false
          $terminalGeneration = $null
          $relocatedDeadline = (Get-Date).AddSeconds(30)
          while (-not $uninstall.HasExited -and (Get-Date) -lt $relocatedDeadline) {
            $normalRelocated = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like ([IO.Path]::GetTempPath().TrimEnd('\') + '\.TalkingQuill-uninstall-*.exe') }).Count -eq 1
            $terminalRecordPath = "$env:ProgramData\Talking Quill Update Recovery\terminal-uninstall-record-v1.json"
            if (Test-Path -LiteralPath $terminalRecordPath) {
              $terminalRecord = Get-Content -LiteralPath $terminalRecordPath -Raw | ConvertFrom-Json
              $terminalGeneration = $terminalRecord.generation
              if ($terminalGeneration -cnotmatch '^[0-9a-f]{32}$') { throw 'Terminal service generation is invalid.' }
              $terminalService = Get-CimInstance Win32_Service -Filter "Name='TalkingQuillTerminalCleanup-$terminalGeneration'" -ErrorAction SilentlyContinue
              $expectedServiceCommand = '"' + $terminalRecord.serviceImage + '" /TQ-TERMINAL-SERVICE=' + $terminalGeneration
              $terminalOwnerObserved = $terminalOwnerObserved -or ($null -ne $terminalService -and $terminalService.StartMode -ceq 'Auto' -and $terminalService.StartName -ceq 'LocalSystem' -and $terminalService.PathName -ceq $expectedServiceCommand)
            }
            if ($normalRelocated -and $terminalOwnerObserved) { break }
            Start-Sleep -Milliseconds 10
          }
          $uninstall.WaitForExit()
          if (-not $normalRelocated) { throw 'Normal uninstall did not execute through one relocated worker.' }
          if (-not $terminalOwnerObserved) { throw 'Terminal uninstall did not publish a durable launcher-owned record.' }
          if ($uninstall.ExitCode -ne 0) { throw "Synchronous native setup uninstall failed: $($uninstall.ExitCode)" }
          $pendingTerminalDeletion = @((Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue).PendingFileRenameOperations)
          $osOwnedTerminalResidue = @(Get-ChildItem -LiteralPath $env:ProgramData -Force -ErrorAction Stop | Where-Object { $_.Name -like '.Talking Quill.recovery-tombstone-*' -or $_.Name -like '.Talking Quill Terminal Relaunch-*.exe' })
          foreach ($ownedResidue in $osOwnedTerminalResidue) {
            if (-not (@($pendingTerminalDeletion) -contains ('\??\' + $ownedResidue.FullName))) { throw "Terminal residue lacks exact reboot deletion ownership: $($ownedResidue.FullName)" }
          }
          $terminalResidue = @(Get-ChildItem -LiteralPath $env:ProgramData -Force -ErrorAction Stop | Where-Object { $_.Name -like '.Talking Quill.update-*' -or $_.Name -like '.Talking Quill.machine-lock-*' -or $_.Name -like '.Talking Quill.uninstall-finalizer-*' -or $_.Name -like '.Talking Quill.terminal-cleanup-*' -or $_.Name -like '.Talking Quill Terminal Cleanup-*.exe' } | ForEach-Object FullName)
          $terminalResidue += @("$env:ProgramFiles\Talking Quill", "$env:ProgramFiles\.Talking Quill.native-staging", "$env:ProgramFiles\.Talking Quill.native-backup", "$env:ProgramFiles\.Talking Quill.native-transaction-v2.json", "$env:ProgramFiles\Talking Quill Maintenance.exe", "$env:ProgramData\Talking Quill Update Recovery") | Where-Object { Test-Path -LiteralPath $_ }
          $terminalKeys = @('HKLM:\Software\Talking Quill\RecoveryStateLockV1', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Talking Quill', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\App Paths\Talking Quill.exe') | Where-Object { Test-Path -LiteralPath $_ }
          $terminalRegistry = @($terminalKeys)
          $terminalRelaunchOwner = Get-ItemPropertyValue -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Talking Quill Update Relaunch' -ErrorAction SilentlyContinue
          if ($null -ne $terminalRelaunchOwner) { $terminalRegistry += 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run::Talking Quill Update Relaunch' }
          $terminalServices = @(Get-Service -Name 'TalkingQuillTerminalCleanup-*' -ErrorAction SilentlyContinue)
          $terminalRegistry += @($terminalServices | ForEach-Object { "SCM::$($_.Name)" })
          foreach ($staleGeneration in @('aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb')) {
            $staleRoot = Join-Path $env:LOCALAPPDATA "Talking Quill\Windows Update Recovery\$staleGeneration"
            $staleProfileValue = Get-ItemPropertyValue -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name "Talking Quill Update Relaunch $staleGeneration" -ErrorAction SilentlyContinue
            if ($null -ne $staleProfileValue) { $terminalRegistry += "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run::Talking Quill Update Relaunch $staleGeneration" }
            if (Test-Path -LiteralPath $staleRoot) { $terminalResidue += $staleRoot }
          }
          if ($terminalResidue.Count -ne 0 -or $terminalRegistry.Count -ne 0) { throw 'Synchronous uninstall retained protected recovery residue.' }
          $faultDocument = Get-Content -LiteralPath tmp/windows-installer-fault-recovery-${{ matrix.arch }}.json -Raw | ConvertFrom-Json
          $faultDocument | Add-Member -NotePropertyName terminalCleanup -NotePropertyValue @{ inspected = $true; acceptanceSetupSha256 = $terminalAcceptanceHash; scenarios = @($terminalFaultEvidence); residue = @($terminalResidue); registry = @($terminalRegistry) }
          $faultDocument | ConvertTo-Json -Depth 30 -Compress | Set-Content -LiteralPath tmp/windows-installer-fault-recovery-${{ matrix.arch }}.json -Encoding utf8

      - name: Upload successful authenticated lifecycle evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ matrix.arch }}-native-installed-lifecycle-evidence
          path: |
            tmp/windows-installer-success-${{ matrix.arch }}.json
            tmp/windows-installer-fault-recovery-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  fresh-lifecycle:
    name: Verify public fresh Windows ${{ matrix.arch }} setup end to end
    needs: [validate, package, smoke]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-${{ matrix.arch }}-exact-native-setup-input
          path: preserved
      - name: Observe authenticated fresh install, inspect it, then remove it
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $setup = @(Get-ChildItem preserved/tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected one public fresh setup.' }
          $freshAttempt = Start-Process -FilePath $setup[0].FullName -ArgumentList '/S' -PassThru
          $freshInterrupted = $false
          $freshDeadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $freshDeadline) {
            $transaction = "$env:ProgramFiles\.Talking Quill.native-transaction-v2.json"
            if (Test-Path -LiteralPath $transaction) {
              $state = Get-Content -LiteralPath $transaction -Raw | ConvertFrom-Json
              if ($state.phase -eq 'published-before-persist') {
                $worker = @(Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $freshAttempt.Id -and $_.ExecutablePath -ceq $setup[0].FullName } | Select-Object -First 1)
                if ($worker.Count -eq 1) { Stop-Process -Id $worker[0].ProcessId -Force; $freshInterrupted = $true; break }
              }
            }
            Start-Sleep -Milliseconds 2
          }
          $freshAttempt.WaitForExit()
          if (-not $freshInterrupted) { throw 'Production fresh publication was not interrupted.' }
          $firstFreshRecovery = Start-Process -FilePath $setup[0].FullName -ArgumentList '/S' -PassThru
          $removeFreshRecoveryInterrupted = $false
          $freshRecoveryDeadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $freshRecoveryDeadline) {
            if (Test-Path -LiteralPath $transaction) {
              $state = Get-Content -LiteralPath $transaction -Raw | ConvertFrom-Json
              if ($state.phase -eq 'recovering-remove-fresh') {
                $worker = @(Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $firstFreshRecovery.Id -and $_.ExecutablePath -ceq $setup[0].FullName } | Select-Object -First 1)
                if ($worker.Count -eq 1) { Stop-Process -Id $worker[0].ProcessId -Force; $removeFreshRecoveryInterrupted = $true; break }
              }
            }
            Start-Sleep -Milliseconds 2
          }
          $firstFreshRecovery.WaitForExit()
          if (-not $removeFreshRecoveryInterrupted) { throw 'recovering-remove-fresh was not interrupted.' }
          $freshRecovery = Start-Process -FilePath $setup[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($freshRecovery.ExitCode -ne 0) { throw "Production fresh recovery failed: $($freshRecovery.ExitCode)" }
          node scripts/windows-package-lifecycle.mjs --arch ${{ matrix.arch }} --mode installed --root "$env:ProgramFiles\Talking Quill"
          foreach ($residue in @("$env:ProgramFiles\.Talking Quill.native-staging", "$env:ProgramFiles\.Talking Quill.native-backup", $transaction)) { if (Test-Path -LiteralPath $residue) { throw "Fresh recovery retained $residue" } }
          $cleanup = Start-Process -FilePath "$env:ProgramFiles\Talking Quill Maintenance.exe" -ArgumentList '/S' -Wait -PassThru
          if ($cleanup.ExitCode -ne 0) { throw "Fresh recovery cleanup failed: $($cleanup.ExitCode)" }
          $framework = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319'
          & (Join-Path $framework 'csc.exe') /nologo /r:System.Management.dll /out:tmp/windows-installer-success-observer.exe scripts/windows-installer-success-observer.cs
          if ($LASTEXITCODE -ne 0) { throw 'Fresh lifecycle observer compilation failed.' }
          $hash = (Get-FileHash -LiteralPath $setup[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          & tmp/windows-installer-success-observer.exe $setup[0].FullName tmp/windows-installer-success-fresh-${{ matrix.arch }}.json 180000 ${{ matrix.arch }} '${{ needs.validate.outputs.release_commit }}' '${{ needs.validate.outputs.release_tree }}' fresh $hash
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated fresh setup observation failed.' }
          node scripts/windows-package-lifecycle.mjs --arch ${{ matrix.arch }} --mode installed --root "$env:ProgramFiles\Talking Quill"
          $uninstall = Start-Process -FilePath "$env:ProgramFiles\Talking Quill Maintenance.exe" -ArgumentList '/S' -PassThru
          $uninstallInterrupted = $false
          $uninstallDeadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $uninstallDeadline) {
            $transaction = "$env:ProgramFiles\.Talking Quill.native-transaction-v2.json"
            if (Test-Path -LiteralPath $transaction) {
              $state = Get-Content -LiteralPath $transaction -Raw | ConvertFrom-Json
              if ($state.phase -eq 'uninstalling') {
                $workers = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like '*\.TalkingQuill-uninstall-*.exe' } | Sort-Object CreationDate -Descending)
                if ($workers.Count -ge 1) { Stop-Process -Id $workers[0].ProcessId -Force; $uninstallInterrupted = $true; break }
              }
            }
            Start-Sleep -Milliseconds 2
          }
          $uninstall.WaitForExit()
          if (-not $uninstallInterrupted) { throw 'Production uninstall mutation was not interrupted.' }
          $maintenance = "$env:ProgramFiles\Talking Quill Maintenance.exe"
          $uninstallKey = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Talking Quill'
          if (-not (Test-Path -LiteralPath $maintenance) -or -not (Test-Path -LiteralPath $uninstallKey)) { throw 'Installed maintenance recovery entry did not survive interrupted uninstall.' }
          $registeredRecovery = (Get-ItemProperty -LiteralPath $uninstallKey -Name QuietUninstallString).QuietUninstallString
          if ($registeredRecovery -cne ('"' + $maintenance + '" /S')) { throw 'Interrupted uninstall recovery registration is not exact.' }
          $firstUninstallRecovery = Start-Process -FilePath $maintenance -ArgumentList '/S' -PassThru
          $finishUninstallRecoveryInterrupted = $false
          $finishDeadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $finishDeadline) {
            if (Test-Path -LiteralPath $transaction) {
              $state = Get-Content -LiteralPath $transaction -Raw | ConvertFrom-Json
              if ($state.phase -eq 'recovering-finish-uninstall') {
                $workers = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like '*\.TalkingQuill-uninstall-*.exe' -or $_.ExecutablePath -ceq $maintenance } | Sort-Object CreationDate -Descending)
                if ($workers.Count -ge 1) { Stop-Process -Id $workers[0].ProcessId -Force; $finishUninstallRecoveryInterrupted = $true; break }
              }
            }
            Start-Sleep -Milliseconds 2
          }
          $firstUninstallRecovery.WaitForExit()
          if (-not $finishUninstallRecoveryInterrupted) { throw 'recovering-finish-uninstall was not interrupted.' }
          if (-not (Test-Path -LiteralPath $maintenance) -or -not (Test-Path -LiteralPath $uninstallKey)) { throw 'Installed maintenance recovery entry was lost before terminal recovery.' }
          $uninstallRecovery = Start-Process -FilePath $maintenance -ArgumentList '/S' -Wait -PassThru
          if ($uninstallRecovery.ExitCode -ne 0) { throw "Final uninstall recovery failed: $($uninstallRecovery.ExitCode)" }
          $machineResidue = @(
            "$env:ProgramFiles\Talking Quill",
            "$env:ProgramFiles\.Talking Quill.native-staging",
            "$env:ProgramFiles\.Talking Quill.native-backup",
            $transaction,
            $maintenance,
            "$env:ProgramData\Talking Quill\KeyboardAuthority",
            "$env:ProgramData\Talking Quill\.KeyboardAuthority.retirement-quarantine",
            "$env:ProgramData\Talking Quill Update Recovery"
          ) | Where-Object { Test-Path -LiteralPath $_ }
          $machineResidue += @(Get-ChildItem -LiteralPath $env:ProgramData -Force -ErrorAction Stop | Where-Object { $_.Name -like '.Talking Quill.update-*' -or $_.Name -like '.Talking Quill.machine-lock-*' -or $_.Name -like '.Talking Quill.uninstall-finalizer-*' -or $_.Name -like '.Talking Quill.terminal-cleanup-*' -or $_.Name -like '.Talking Quill Terminal Cleanup-*.exe' } | ForEach-Object FullName)
          $runProperties = @((Get-ItemProperty -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).PSObject.Properties)
          $recoveryValues = @($runProperties | Where-Object { $_.Name -like 'Talking Quill Update Recovery *' -or $_.Name -ceq 'Talking Quill Update Relaunch' })
          $terminalServices = @(Get-Service -Name 'TalkingQuillTerminalCleanup-*' -ErrorAction SilentlyContinue)
          $uninstallRegistration = Test-Path -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Talking Quill'
          $appPathRegistration = Test-Path -LiteralPath 'HKLM:\Software\Microsoft\Windows\CurrentVersion\App Paths\Talking Quill.exe'
          $machineLockRegistration = Test-Path -LiteralPath 'HKLM:\Software\Talking Quill\RecoveryStateLockV1'
          $legacyService = $null -ne (Get-Service -Name TalkingQuillKeyboardAuthority -ErrorAction SilentlyContinue)
          $nativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          & "$env:WINDIR\System32\schtasks.exe" /Query /TN TalkingQuillKeyboardAuthority *> $null
          $taskQueryExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
          if ($taskQueryExit -notin @(0, 1)) { throw "Legacy task query failed: $taskQueryExit" }
          $legacyTask = $taskQueryExit -eq 0
          if ($machineResidue.Count -ne 0 -or $recoveryValues.Count -ne 0 -or $terminalServices.Count -ne 0 -or $uninstallRegistration -or $appPathRegistration -or $machineLockRegistration -or $legacyService -or $legacyTask) { throw 'Recovered uninstall retained updater recovery, terminal service, machine lock, finalizer, registration, legacy service, or task state.' }
          $freshEvidence = Get-Content -LiteralPath tmp/windows-installer-success-fresh-${{ matrix.arch }}.json -Raw | ConvertFrom-Json
          $freshEvidence | Add-Member -NotePropertyName productionInterruptions -NotePropertyValue @{ fresh = $freshInterrupted; removeFreshRecovery = $removeFreshRecoveryInterrupted; uninstall = $uninstallInterrupted; finishUninstallRecovery = $finishUninstallRecoveryInterrupted }
          $freshEvidence | ConvertTo-Json -Depth 30 -Compress | Set-Content -LiteralPath tmp/windows-installer-success-fresh-${{ matrix.arch }}.json -Encoding utf8
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ matrix.arch }}-fresh-installed-evidence
          path: tmp/windows-installer-success-fresh-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Checksum preserved Windows x64 installer
    needs: [validate, package, smoke, lifecycle, fresh-lifecycle]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD^{commit})" = "${{ needs.validate.outputs.release_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.validate.outputs.release_tree }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64-exact-native-setup-input
          path: preserved/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-arm64-exact-native-setup-input
          path: preserved/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64-native-ui-smoke-evidence
          path: smoke-evidence/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-arm64-native-ui-smoke-evidence
          path: smoke-evidence/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-*-native-installed-lifecycle-evidence
          path: installed-evidence
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-*-fresh-installed-evidence
          path: fresh-evidence
          merge-multiple: true
      - name: Assemble immutable native release files
        env:
          TALKING_QUILL_WINDOWS_PROMOTION_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.TALKING_QUILL_WINDOWS_PROMOTION_SIGNING_KEY_PKCS8_BASE64 }}
          TALKING_QUILL_RELEASE_MANIFEST_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.TALKING_QUILL_RELEASE_MANIFEST_SIGNING_KEY_PKCS8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          for arch in x64 arm64; do
            installer=(preserved/$arch/tmp/release-upload/Talking-Quill-*-win-$arch-setup.exe)
            test "${#installer[@]}" -eq 1
            node scripts/windows-installer-ui-evidence.mjs --evidence smoke-evidence/$arch/windows-installer-ui-smoke-$arch.json --installer "${installer[0]}" --provenance preserved/$arch/tmp/release-upload/provenance-win-$arch-setup.json --arch "$arch"
            node scripts/windows-installer-success-evidence.mjs --evidence fresh-evidence/windows-installer-success-fresh-$arch.json --installer "${installer[0]}" --provenance preserved/$arch/tmp/release-upload/provenance-win-$arch-setup.json --arch "$arch" --operation fresh
            update=(preserved/$arch/tmp/release-upload/Talking-Quill-*-win-$arch-update.exe)
            test "${#update[@]}" -eq 1
            node scripts/windows-installer-success-evidence.mjs --evidence installed-evidence/windows-installer-success-$arch.json --installer "${update[0]}" --provenance preserved/$arch/tmp/release-upload/provenance-win-$arch-update.json --arch "$arch" --operation repair
            cp smoke-evidence/$arch/windows-installer-ui-smoke-$arch.json release-artifacts/
            cp preserved/$arch/tmp/release-upload/Talking-Quill-*-win-$arch-{setup,update}.exe release-artifacts/
            cp preserved/$arch/tmp/release-upload/Talking-Quill-*-win-$arch-update.exe.blockmap release-artifacts/
            cp preserved/$arch/tmp/release-upload/latest-$arch.yml release-artifacts/
            cp preserved/$arch/tmp/release-upload/release-identity-win-$arch.json release-artifacts/
            cp preserved/$arch/tmp/release-upload/provenance-win-$arch-setup.json release-artifacts/
            cp preserved/$arch/tmp/release-upload/provenance-win-$arch-update.json release-artifacts/
            grep -q 'talkingQuillRelease:' release-artifacts/latest-$arch.yml
            ARCH=$arch node -e 'const arch=process.env.ARCH; const value=require(`./release-artifacts/release-identity-win-${arch}.json`); if (value.platform !== "win" || value.architecture !== arch || value.predecessor === null || value.roles?.map(({role}) => role).join(",") !== "gateway,owner") process.exit(1)'
          done
          cp fresh-evidence/windows-installer-success-fresh-*.json release-artifacts/
          cp installed-evidence/*.json release-artifacts/
          node scripts/windows-promotion-evidence.mjs --create --directory release-artifacts --output release-artifacts/windows-promotion-lifecycle-evidence-v1.json --repository '${{ github.repository }}' --run-id '${{ github.run_id }}' --public-key build/windows-promotion-public-key.sec1 --update-public-key build/windows-update-public-key.sec1
          cp preserved/x64/tmp/release-upload/THIRD_PARTY_NOTICES.txt release-artifacts/
          cp preserved/x64/tmp/release-upload/release-manifest.json release-artifacts/
          if find release-artifacts -type f -name '*terminalAcceptance*' | grep -q .; then echo 'Nonpromotable terminal acceptance setup entered release assembly.' >&2; exit 1; fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { validateArtifactProvenanceManifest } from './scripts/artifact-provenance.mjs';
          import { sealReleaseManifest, validateReleaseManifest } from './scripts/release-manifest.mjs';
          const directory = 'release-artifacts';
          const manifestPath = `${directory}/release-manifest.json`;
          const manifest = validateReleaseManifest(JSON.parse(fs.readFileSync(manifestPath, 'utf8')));
          const provenance = ['arm64', 'x64'].flatMap((arch) => ['setup', 'update'].map((mode) => {
            const name = `provenance-win-${arch}-${mode}.json`;
            const value = JSON.parse(fs.readFileSync(`${directory}/${name}`, 'utf8'));
            validateArtifactProvenanceManifest(value);
            const installer = `Talking-Quill-${manifest.version}-win-${arch}-${mode}.exe`;
            const final = value.entries.filter(({ role }) => role === 'final-artifact');
            const bytes = fs.readFileSync(`${directory}/${installer}`);
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            if (value.sourceCommit !== manifest.sourceCommit || value.sourceTree !== manifest.sourceTree ||
                value.package.version !== manifest.version || value.package.platform !== 'win' ||
                value.package.arch !== arch || final.length !== 1 ||
                final[0].path.split('/').at(-1) !== installer || final[0].sha256 !== sha256) {
              throw new Error(`Downloaded ${arch} ${mode} provenance does not match its exact installer and source`);
            }
            return { name, platform: 'win', arch, mode, sourceTree: value.sourceTree,
              sourceTreeSha256: value.sourceTreeSha256 };
          }));
          if (new Set(provenance.map(({ sourceTreeSha256 }) => sourceTreeSha256)).size !== 1) {
            throw new Error('Architecture provenance source-tree hashes disagree');
          }
          manifest.architecture = 'x64+arm64';
          manifest.provenance = provenance;
          manifest.assets = fs.readdirSync(directory).filter((name) => name !== 'release-manifest.json').sort().map((name) => {
            const bytes = fs.readFileSync(`${directory}/${name}`);
            return { name, bytes: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex') };
          });
          fs.writeFileSync(manifestPath, `${JSON.stringify(sealReleaseManifest(manifest), null, 2)}\n`);
          NODE
          node scripts/publication-manifest.mjs --create --directory release-artifacts --output release-artifacts/release-publication-manifest-v1.json --repository '${{ github.repository }}' --tag "v$(node -p \"require('./app/package.json').version\")" --sequence '${{ github.run_number }}' --run-id '${{ github.run_id }}' --source-commit '${{ needs.validate.outputs.release_commit }}' --source-tree '${{ needs.validate.outputs.release_tree }}' --public-key build/release-manifest-public-key.sec1
          node scripts/publication-manifest.mjs --manifest release-artifacts/release-publication-manifest-v1.json --directory release-artifacts --repository '${{ github.repository }}' --tag "v$(node -p \"require('./app/package.json').version\")" --sequence '${{ github.run_number }}' --run-id '${{ github.run_id }}' --source-commit '${{ needs.validate.outputs.release_commit }}' --source-tree '${{ needs.validate.outputs.release_tree }}' --public-key build/release-manifest-public-key.sec1
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-artifacts/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-native-release-candidates
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
