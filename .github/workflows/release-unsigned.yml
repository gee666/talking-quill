name: Publish unsigned release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Require a default-branch manual run
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
          test "$GITHUB_REPOSITORY" = "gee666/talking-quill"
      - id: identity
        name: Validate matching application versions
        shell: bash
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const root = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const app = JSON.parse(readFileSync('app/package.json', 'utf8')).version;
          const cargo = /^version\s*=\s*"([^"]+)"/m.exec(readFileSync('helper/Cargo.toml', 'utf8'))?.[1];
          if (!/^\d+\.\d+\.\d+$/.test(root) || root !== app || app !== cargo) {
            throw new Error(`Versions must match strict semver (root=${root}, app=${app}, helper=${cargo})`);
          }
          const commit = execFileSync('git', ['rev-parse', 'HEAD^{commit}'], { encoding: 'utf8' }).trim();
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${root}\ntag=v${root}\ncommit=${commit}\n`);
          NODE
      - name: Require a new tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi

  validate:
    name: Validate on ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - name: Fetch every locked Rust target graph used by notice validation
        run: pnpm rust:fetch-targets
      - run: pnpm validate:unsigned-release
      - if: matrix.os == 'windows-latest'
        run: pnpm security:gate

  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            command: package:unsigned:win
          - os: windows-11-arm
            platform: win
            arch: arm64
            command: package:unsigned:win:arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
            command: package:unsigned:mac:x64
          - os: macos-15
            platform: mac
            arch: arm64
            command: package:unsigned:mac:arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TALKING_QUILL_REQUIRE_CLEAN_SOURCE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.97.1
      - name: Require clean source before dependency installation
        shell: pwsh
        run: if ((git status --porcelain --untracked-files=normal).Length -ne 0) { throw 'Package source is not clean.' }
      - run: pnpm install --frozen-lockfile
      - name: Fetch every locked Rust target graph used by package validation
        run: pnpm rust:fetch-targets
      - run: pnpm ${{ matrix.command }}
      - run: node scripts/stage-unsigned-release.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Require source immutability after packaging
        shell: pwsh
        run: if ((git status --porcelain --untracked-files=normal).Length -ne 0) { throw 'Packaging modified the release source.' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-part-${{ matrix.platform }}-${{ matrix.arch }}
          path: tmp/release-upload/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble and checksum release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-part-*
          path: release-artifacts
          merge-multiple: true
      - name: Assemble exact release assets
        env:
          TALKING_QUILL_RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          cp app/assets/THIRD_PARTY_NOTICES.txt release-artifacts/THIRD_PARTY_NOTICES.txt
          node scripts/assemble-release.mjs "${{ needs.prepare.outputs.tag }}" release-artifacts
          node scripts/release-checksums.mjs release-artifacts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: assembled-${{ needs.prepare.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assembled-${{ needs.prepare.outputs.tag }}
          path: release-artifacts
      - name: Create and verify a complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG appeared while the release was building." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG appeared while the release was building." >&2
            exit 1
          fi
          gh release create "$TAG" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$COMMIT" \
            --title "Talking Quill $TAG (unsigned)" \
            --generate-notes
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$COMMIT"
          mkdir -p tmp/release-verification/downloaded
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > tmp/release-verification/draft.json
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir tmp/release-verification/downloaded
          node scripts/verify-draft-release.mjs \
            "$TAG" "$COMMIT" \
            release-artifacts/release-manifest.json \
            release-artifacts/SHA256SUMS.txt \
            tmp/release-verification/draft.json \
            tmp/release-verification/downloaded
      - name: Publish only after byte verification
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          for attempt in {1..12}; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > tmp/release-verification/public-tag.json
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" > tmp/release-verification/public-latest.json
            if node scripts/verify-public-release.mjs \
              "$TAG" "$COMMIT" \
              release-artifacts/release-manifest.json \
              tmp/release-verification/public-tag.json \
              tmp/release-verification/public-latest.json; then
              exit 0
            fi
            sleep 5
          done
          echo 'Published release did not become the public latest release in time.' >&2
          exit 1
