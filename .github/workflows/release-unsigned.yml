name: Build Windows x64 and ARM64 NSIS release candidates

on:
  workflow_dispatch:
    inputs:
      predecessor_x64_version:
        description: Exact installed x64 predecessor version
        required: true
        type: string
      predecessor_x64_release_build:
        description: Exact x64 predecessor release-build SHA-256
        required: true
        type: string
      predecessor_x64_installer_url:
        description: HTTPS URL for the exact published x64 predecessor NSIS installer
        required: true
        type: string
      predecessor_x64_installer_sha256:
        description: Exact published x64 predecessor NSIS SHA-256
        required: true
        type: string
      predecessor_x64_gateway_sha256:
        description: Exact x64 predecessor gateway SHA-256
        required: true
        type: string
      predecessor_x64_owner_sha256:
        description: Exact x64 predecessor owner SHA-256
        required: true
        type: string
      predecessor_x64_gateway_url:
        description: HTTPS URL for the exact published x64 predecessor gateway artifact
        required: true
        type: string
      predecessor_x64_owner_url:
        description: HTTPS URL for the exact published x64 predecessor owner artifact
        required: true
        type: string
      predecessor_x64_update_public_key_sha256:
        description: Secondary assertion for the key inspected from the x64 predecessor gateway
        required: true
        type: string
      predecessor_arm64_version:
        description: Exact installed ARM64 predecessor version
        required: true
        type: string
      predecessor_arm64_release_build:
        description: Exact ARM64 predecessor release-build SHA-256
        required: true
        type: string
      predecessor_arm64_installer_url:
        description: HTTPS URL for the exact published ARM64 predecessor NSIS installer
        required: true
        type: string
      predecessor_arm64_installer_sha256:
        description: Exact published ARM64 predecessor NSIS SHA-256
        required: true
        type: string
      predecessor_arm64_gateway_sha256:
        description: Exact ARM64 predecessor gateway SHA-256
        required: true
        type: string
      predecessor_arm64_owner_sha256:
        description: Exact ARM64 predecessor owner SHA-256
        required: true
        type: string
      predecessor_arm64_gateway_url:
        description: HTTPS URL for the exact published ARM64 predecessor gateway artifact
        required: true
        type: string
      predecessor_arm64_owner_url:
        description: HTTPS URL for the exact published ARM64 predecessor owner artifact
        required: true
        type: string
      predecessor_arm64_update_public_key_sha256:
        description: Secondary assertion for the key inspected from the ARM64 predecessor gateway
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-x64-arm64-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      release_commit: ${{ steps.source.outputs.commit }}
      release_tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Require clean coordinated release source
        shell: bash
        run: node scripts/release-source-preflight.mjs "$(node -p "'v' + require('./app/package.json').version")"
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fetch-targets
      - run: pnpm validate:unsigned-release
      - name: Install the pinned RustSec scanner
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: pnpm security:gate

  package:
    name: Package and preserve Windows ${{ matrix.arch }} NSIS
    needs: validate
    runs-on: windows-latest
    environment: release-signing
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            package_script: package:win
            unpacked: win-unpacked
          - arch: arm64
            package_script: package:win:arm64
            unpacked: win-arm64-unpacked
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TALKING_QUILL_REQUIRE_CLEAN_SOURCE: '1'
      TALKING_QUILL_RELEASE_COMMIT: ${{ needs.validate.outputs.release_commit }}
      TALKING_QUILL_RELEASE_TREE: ${{ needs.validate.outputs.release_tree }}
      TALKING_QUILL_PACKAGE_INSPECTION_STRICT: '1'
      TALKING_QUILL_PACKAGE_ARTIFACTS_REQUIRED: nsis
      TALKING_QUILL_PACKAGE_TARGET: win
      TALKING_QUILL_PACKAGE_ARCH: ${{ matrix.arch }}
      TALKING_QUILL_PACKAGE_MODE: update
      TALKING_QUILL_PREDECESSOR_VERSION: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_version || inputs.predecessor_arm64_version }}
      TALKING_QUILL_PREDECESSOR_RELEASE_BUILD: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_release_build || inputs.predecessor_arm64_release_build }}
      TALKING_QUILL_PREDECESSOR_GATEWAY_SHA256: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_gateway_sha256 || inputs.predecessor_arm64_gateway_sha256 }}
      TALKING_QUILL_PREDECESSOR_OWNER_SHA256: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_owner_sha256 || inputs.predecessor_arm64_owner_sha256 }}
      TALKING_QUILL_PREDECESSOR_GATEWAY_URL: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_gateway_url || inputs.predecessor_arm64_gateway_url }}
      TALKING_QUILL_PREDECESSOR_OWNER_URL: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_owner_url || inputs.predecessor_arm64_owner_url }}
      TALKING_QUILL_PREDECESSOR_UPDATE_PUBLIC_KEY_SHA256: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_update_public_key_sha256 || inputs.predecessor_arm64_update_public_key_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD^{commit})" = "${{ needs.validate.outputs.release_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.validate.outputs.release_tree }}"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - name: Require clean source before dependency installation
        shell: pwsh
        run: if ((git status --porcelain --untracked-files=normal).Length -ne 0) { throw 'Package source is not clean.' }
      - run: pnpm install --frozen-lockfile
      - name: Inspect exact predecessor roles
        shell: pwsh
        run: |
          if (-not $env:TALKING_QUILL_PREDECESSOR_GATEWAY_URL.StartsWith('https://') -or -not $env:TALKING_QUILL_PREDECESSOR_OWNER_URL.StartsWith('https://')) { throw 'Predecessor role URLs must use HTTPS.' }
          New-Item -ItemType Directory -Force tmp | Out-Null
          $gateway = (Resolve-Path tmp).Path + '\predecessor-gateway-${{ matrix.arch }}.exe'
          $owner = (Resolve-Path tmp).Path + '\predecessor-owner-${{ matrix.arch }}.exe'
          Invoke-WebRequest -Uri $env:TALKING_QUILL_PREDECESSOR_GATEWAY_URL -OutFile $gateway
          Invoke-WebRequest -Uri $env:TALKING_QUILL_PREDECESSOR_OWNER_URL -OutFile $owner
          $env:TALKING_QUILL_PREDECESSOR_GATEWAY_PATH = $gateway
          $env:TALKING_QUILL_PREDECESSOR_OWNER_PATH = $owner
          node -e "import('./scripts/release-package-metadata.mjs').then(({readPackagePredecessor})=>{const fs=require('fs');readPackagePredecessor(process.env,'win','${{ matrix.arch }}');fs.appendFileSync(process.env.GITHUB_ENV,'TALKING_QUILL_PREDECESSOR_GATEWAY_PATH='+process.env.TALKING_QUILL_PREDECESSOR_GATEWAY_PATH+'\nTALKING_QUILL_PREDECESSOR_OWNER_PATH='+process.env.TALKING_QUILL_PREDECESSOR_OWNER_PATH+'\n')})"
      - run: node scripts/prepare-seven-zip.mjs x64
      # Invoke the app package command directly. It builds and inspects the NSIS
      # before any source-test ABI restoration or installed lifecycle work.
      - run: pnpm --filter @talking-quill/app ${{ matrix.package_script }}
      # Canonical staging binds the exact installer bytes to the two-role
      # talkingQuillRelease identity and copies the matching provenance.
      - name: Authorize updater metadata and stage exact payload
        env:
          TALKING_QUILL_WINDOWS_UPDATE_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.TALKING_QUILL_WINDOWS_UPDATE_SIGNING_KEY_PKCS8_BASE64 }}
        run: node scripts/stage-unsigned-release.mjs win ${{ matrix.arch }}
      # Validate the exact staged producer inventory and create the manifest
      # consumed by publication before any artifact upload or checksum pass.
      - name: Assemble the staged producer inventory
        shell: bash
        run: |
          set -euo pipefail
          tag="$(node -p "'v' + require('./app/package.json').version")"
          node scripts/assemble-release.mjs "$tag" tmp/release-upload
      # Transfer the provenance-bound bytes to the architecture-native smoke
      # runner. No evidence exists until that runner exercises these exact bytes.
      - name: Upload provenance-bound exact NSIS smoke input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ matrix.arch }}-exact-nsis-input
          path: |
            tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}.exe
            tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}.exe.blockmap
            tmp/release-upload/latest-${{ matrix.arch }}.yml
            tmp/release-upload/release-identity-win-${{ matrix.arch }}.json
            tmp/release-upload/provenance-win-${{ matrix.arch }}.json
            tmp/release-upload/THIRD_PARTY_NOTICES.txt
            tmp/release-upload/release-manifest.json
            release/${{ matrix.unpacked }}/**
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke exact Windows ${{ matrix.arch }} NSIS on native hardware
    needs: [validate, package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD^{commit})" = "${{ needs.validate.outputs.release_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.validate.outputs.release_tree }}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-${{ matrix.arch }}-exact-nsis-input
          path: preserved
      - name: Run native interactive cancellation smoke on exact transferred bytes
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem preserved/tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}.exe)
          if ($installers.Count -ne 1) { throw 'Expected one exact installer for native GUI smoke.' }
          node scripts/run-windows-installer-ui-smoke.mjs --arch ${{ matrix.arch }} --installer $installers[0].FullName --provenance preserved/tmp/release-upload/provenance-win-${{ matrix.arch }}.json --output tmp/windows-installer-ui-smoke-${{ matrix.arch }}.json
          node scripts/windows-installer-ui-evidence.mjs --evidence tmp/windows-installer-ui-smoke-${{ matrix.arch }}.json --installer $installers[0].FullName --provenance preserved/tmp/release-upload/provenance-win-${{ matrix.arch }}.json --arch ${{ matrix.arch }}
      - name: Upload architecture-native GUI smoke evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ matrix.arch }}-native-ui-smoke-evidence
          path: tmp/windows-installer-ui-smoke-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  lifecycle:
    name: Verify preserved Windows ${{ matrix.arch }} lifecycle
    needs: [validate, package, smoke]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            unpacked: win-unpacked
          - arch: arm64
            runner: windows-11-arm
            unpacked: win-arm64-unpacked
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD^{commit})" = "${{ needs.validate.outputs.release_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.validate.outputs.release_tree }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-${{ matrix.arch }}-exact-nsis-input
          path: preserved
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-${{ matrix.arch }}-native-ui-smoke-evidence
          path: smoke-evidence
      - name: Revalidate mandatory installer GUI smoke evidence before installation
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem preserved/tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}.exe)
          if ($installers.Count -ne 1) { throw 'Expected one exact installer for GUI smoke validation.' }
          node scripts/windows-installer-ui-evidence.mjs --evidence smoke-evidence/windows-installer-ui-smoke-${{ matrix.arch }}.json --installer $installers[0].FullName --provenance preserved/tmp/release-upload/provenance-win-${{ matrix.arch }}.json --arch ${{ matrix.arch }}
      - run: node scripts/windows-package-lifecycle.mjs --arch ${{ matrix.arch }} --mode unpacked --root preserved/release/${{ matrix.unpacked }}
      - name: Install exact authenticated predecessor, then update candidate
        shell: pwsh
        env:
          PREDECESSOR_INSTALLER_URL: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_installer_url || inputs.predecessor_arm64_installer_url }}
          PREDECESSOR_INSTALLER_SHA256: ${{ matrix.arch == 'x64' && inputs.predecessor_x64_installer_sha256 || inputs.predecessor_arm64_installer_sha256 }}
        run: |
          if (-not $env:PREDECESSOR_INSTALLER_URL.StartsWith('https://') -or $env:PREDECESSOR_INSTALLER_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Predecessor installer identity is invalid.' }
          $predecessor = Join-Path $env:RUNNER_TEMP 'talking-quill-exact-predecessor.exe'
          Invoke-WebRequest -Uri $env:PREDECESSOR_INSTALLER_URL -OutFile $predecessor
          $actual = (Get-FileHash -LiteralPath $predecessor -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:PREDECESSOR_INSTALLER_SHA256) { throw 'Predecessor installer SHA-256 mismatch.' }
          $previous = Start-Process -FilePath $predecessor -ArgumentList '/S' -Wait -PassThru
          if ($previous.ExitCode -ne 0) { throw "Predecessor NSIS install failed: $($previous.ExitCode)" }
          $installers = @(Get-ChildItem preserved/tmp/release-upload/Talking-Quill-*-win-${{ matrix.arch }}.exe)
          if ($installers.Count -ne 1) { throw "Expected one preserved ${{ matrix.arch }} installer, found $($installers.Count)" }
          $candidate = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($candidate.ExitCode -ne 0) { throw "Candidate NSIS update failed: $($candidate.ExitCode)" }
          node scripts/windows-package-lifecycle.mjs --arch ${{ matrix.arch }} --mode installed --root "$env:ProgramFiles\Talking Quill"
          $uninstaller = "$env:ProgramFiles\Talking Quill\Uninstall Talking Quill.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed: $($uninstall.ExitCode)" }

  assemble:
    name: Checksum preserved Windows x64 installer
    needs: [validate, package, smoke, lifecycle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD^{commit})" = "${{ needs.validate.outputs.release_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.validate.outputs.release_tree }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64-exact-nsis-input
          path: preserved/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-arm64-exact-nsis-input
          path: preserved/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64-native-ui-smoke-evidence
          path: smoke-evidence/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-arm64-native-ui-smoke-evidence
          path: smoke-evidence/arm64
      - name: Assemble immutable native release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          for arch in x64 arm64; do
            installer=(preserved/$arch/tmp/release-upload/Talking-Quill-*-win-$arch.exe)
            test "${#installer[@]}" -eq 1
            node scripts/windows-installer-ui-evidence.mjs --evidence smoke-evidence/$arch/windows-installer-ui-smoke-$arch.json --installer "${installer[0]}" --provenance preserved/$arch/tmp/release-upload/provenance-win-$arch.json --arch "$arch"
            cp smoke-evidence/$arch/windows-installer-ui-smoke-$arch.json release-artifacts/
            cp "${installer[0]}" release-artifacts/
            cp preserved/$arch/tmp/release-upload/Talking-Quill-*-win-$arch.exe.blockmap release-artifacts/
            cp preserved/$arch/tmp/release-upload/latest-$arch.yml release-artifacts/
            cp preserved/$arch/tmp/release-upload/release-identity-win-$arch.json release-artifacts/
            cp preserved/$arch/tmp/release-upload/provenance-win-$arch.json release-artifacts/
            grep -q 'talkingQuillRelease:' release-artifacts/latest-$arch.yml
            ARCH=$arch node -e 'const arch=process.env.ARCH; const value=require(`./release-artifacts/release-identity-win-${arch}.json`); if (value.platform !== "win" || value.architecture !== arch || value.predecessor === null || value.roles?.map(({role}) => role).join(",") !== "gateway,owner") process.exit(1)'
          done
          cp preserved/x64/tmp/release-upload/THIRD_PARTY_NOTICES.txt release-artifacts/
          cp preserved/x64/tmp/release-upload/release-manifest.json release-artifacts/
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { validateArtifactProvenanceManifest } from './scripts/artifact-provenance.mjs';
          import { sealReleaseManifest, validateReleaseManifest } from './scripts/release-manifest.mjs';
          const directory = 'release-artifacts';
          const manifestPath = `${directory}/release-manifest.json`;
          const manifest = validateReleaseManifest(JSON.parse(fs.readFileSync(manifestPath, 'utf8')));
          const provenance = ['arm64', 'x64'].map((arch) => {
            const name = `provenance-win-${arch}.json`;
            const value = JSON.parse(fs.readFileSync(`${directory}/${name}`, 'utf8'));
            validateArtifactProvenanceManifest(value);
            const installer = `Talking-Quill-${manifest.version}-win-${arch}.exe`;
            const final = value.entries.filter(({ role }) => role === 'final-artifact');
            const bytes = fs.readFileSync(`${directory}/${installer}`);
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            if (value.sourceCommit !== manifest.sourceCommit || value.sourceTree !== manifest.sourceTree ||
                value.package.version !== manifest.version || value.package.platform !== 'win' ||
                value.package.arch !== arch || final.length !== 1 ||
                final[0].path.split('/').at(-1) !== installer || final[0].sha256 !== sha256) {
              throw new Error(`Downloaded ${arch} provenance does not match its exact installer and source`);
            }
            return { name, platform: 'win', arch, sourceTree: value.sourceTree,
              sourceTreeSha256: value.sourceTreeSha256 };
          });
          if (new Set(provenance.map(({ sourceTreeSha256 }) => sourceTreeSha256)).size !== 1) {
            throw new Error('Architecture provenance source-tree hashes disagree');
          }
          manifest.architecture = 'x64+arm64';
          manifest.provenance = provenance;
          manifest.assets = fs.readdirSync(directory).filter((name) => name !== 'release-manifest.json').sort().map((name) => {
            const bytes = fs.readFileSync(`${directory}/${name}`);
            return { name, bytes: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex') };
          });
          fs.writeFileSync(manifestPath, `${JSON.stringify(sealReleaseManifest(manifest), null, 2)}\n`);
          NODE
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-native-release-candidates
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
