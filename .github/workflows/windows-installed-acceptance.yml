name: Windows installed acceptance gate

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native acceptance host architecture
        required: true
        type: choice
        options: [x64]
      acceptance_bundle_url:
        description: HTTPS URL for the frozen acceptance evidence bundle
        required: true
        type: string
      acceptance_bundle_sha256:
        description: Exact SHA-256 of the frozen acceptance evidence bundle
        required: true
        type: string
      acceptance_bundle_authorization:
        description: Canonical signed authorization for this exact URL, digest, architecture, and time window
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-installed-acceptance-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  installed-acceptance:
    name: Staffed native Windows ${{ inputs.architecture }} acceptance
    runs-on:
      - self-hosted
      - Windows
      - interactive
      - talking-quill-acceptance
      - ${{ inputs.architecture }}
    timeout-minutes: 90
    environment: acceptance-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      - name: Authenticate and extract frozen acceptance inputs
        shell: pwsh
        env:
          ACCEPTANCE_BUNDLE_URL: ${{ inputs.acceptance_bundle_url }}
          ACCEPTANCE_BUNDLE_SHA256: ${{ inputs.acceptance_bundle_sha256 }}
          ACCEPTANCE_BUNDLE_AUTHORIZATION: ${{ inputs.acceptance_bundle_authorization }}
          ACCEPTANCE_BUNDLE_PUBLIC_KEY_SPKI_BASE64URL: ${{ vars.TALKING_QUILL_ACCEPTANCE_BUNDLE_PUBLIC_KEY_SPKI_BASE64URL }}
          ACCEPTANCE_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          if (-not $env:ACCEPTANCE_BUNDLE_URL.StartsWith('https://')) { throw 'Acceptance bundle URL must use HTTPS.' }
          if ($env:ACCEPTANCE_BUNDLE_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Acceptance bundle SHA-256 is invalid.' }
          node scripts/verify-windows-acceptance-authorization.mjs
          $authorization = node -e "const b=Buffer.from(process.env.ACCEPTANCE_BUNDLE_AUTHORIZATION,'base64url'); const e=JSON.parse(b); process.stdout.write(JSON.stringify({sourceRevision:e.payload.sourceRevision,producerArtifactSetIdentity:e.payload.producerArtifactSetIdentity,sha256:require('node:crypto').createHash('sha256').update(b).digest('hex')}))" | ConvertFrom-Json
          $sourceRevision = [string]$authorization.sourceRevision
          $env:ACCEPTANCE_PRODUCER_ARTIFACT_SET_IDENTITY = [string]$authorization.producerArtifactSetIdentity
          $env:ACCEPTANCE_BUNDLE_AUTHORIZATION_SHA256 = [string]$authorization.sha256
          if ($env:ACCEPTANCE_PRODUCER_ARTIFACT_SET_IDENTITY -cnotmatch '^[0-9a-f]{64}$' -or $env:ACCEPTANCE_BUNDLE_AUTHORIZATION_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Signed producer or authorization identity is invalid.' }
          if ($sourceRevision -cnotmatch '^[0-9a-f]{40}$') { throw 'Signed acceptance source revision is invalid.' }
          if ($sourceRevision -cne '${{ github.sha }}') { throw 'Signed acceptance source must equal the protected workflow run head.' }
          git checkout --detach $sourceRevision
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne $sourceRevision) { throw 'Runner checkout does not match the signed tooling source revision.' }
          node scripts/release-audit.mjs
          node scripts/reference-independence.mjs
          node scripts/windows-recovery-lineage.mjs
          $env:ACCEPTANCE_SOURCE_REVISION = $head
          "ACCEPTANCE_SOURCE_REVISION=$head" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node scripts/verify-windows-acceptance-authorization.mjs
          New-Item -ItemType Directory -Force tmp/windows-installed-acceptance | Out-Null
          $bundle = (Resolve-Path tmp/windows-installed-acceptance).Path + '\frozen-acceptance.zip'
          Invoke-WebRequest -Uri $env:ACCEPTANCE_BUNDLE_URL -OutFile $bundle
          $actual = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:ACCEPTANCE_BUNDLE_SHA256) { throw 'Acceptance bundle SHA-256 mismatch.' }
          $extraction = node scripts/windows-installed-acceptance-bundle.mjs extract $bundle tmp/windows-installed-acceptance/frozen $env:ACCEPTANCE_ARCHITECTURE - - $env:ACCEPTANCE_BUNDLE_SHA256 - $env:ACCEPTANCE_PRODUCER_ARTIFACT_SET_IDENTITY | ConvertFrom-Json
          $sourceNative = (Resolve-Path tmp/windows-installed-acceptance/frozen/acceptance/native).Path
          $nativeBuildId = node -e "process.stdout.write(require('node:crypto').createHash('sha256').update('${{ github.run_id }}:'+process.env.ACCEPTANCE_PRODUCER_ARTIFACT_SET_IDENTITY).digest('hex'))"
          $nativePublication = node scripts/windows-installed-acceptance-native-publication.mjs publish-bundle --source $sourceNative --output tmp/windows-installed-acceptance --build-id $nativeBuildId | ConvertFrom-Json
          $native = [string]$nativePublication.nativeRoot
          "TQ_ACCEPTANCE_NATIVE_CLEANUP_DESCRIPTOR=$($nativePublication.descriptorPath)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Test-Path -LiteralPath $native)) { throw 'Protected acceptance native publication is absent.' }
          "ACCEPTANCE_MANIFEST_SHA256=$($extraction.manifestSha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACCEPTANCE_PRODUCER_ARTIFACT_SET_IDENTITY=$env:ACCEPTANCE_PRODUCER_ARTIFACT_SET_IDENTITY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACCEPTANCE_BUNDLE_AUTHORIZATION_SHA256=$env:ACCEPTANCE_BUNDLE_AUTHORIZATION_SHA256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACCEPTANCE_BUNDLE_SHA256=$env:ACCEPTANCE_BUNDLE_SHA256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TQ_ACCEPTANCE_PROTECTED_NATIVE_ROOT=$native" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $evidenceInput = Get-Content -Raw -LiteralPath tmp/windows-installed-acceptance/frozen/evidence-input.json | ConvertFrom-Json
          $env:ACCEPTANCE_MANIFEST_PUBLIC_KEY_SPKI_BASE64URL = [string]$evidenceInput.acceptance.manifestPublicKeySpkiBase64url
          node scripts/verify-windows-acceptance-authorization.mjs
      - name: Execute installed acceptance matrix
        shell: pwsh
        run: |
          node scripts/windows-installed-acceptance-bundle.mjs verify-tree tmp/windows-installed-acceptance/frozen '${{ inputs.architecture }}' - - - $env:ACCEPTANCE_MANIFEST_SHA256 $env:ACCEPTANCE_PRODUCER_ARTIFACT_SET_IDENTITY
          node scripts/windows-installed-acceptance.mjs --bundle-root tmp/windows-installed-acceptance/frozen --evidence tmp/windows-installed-acceptance/frozen/evidence-input.json --output tmp/windows-installed-acceptance/evidence.json --execute
      - name: Verify and record exact installed acceptance result
        shell: pwsh
        run: |
          $tree = (git rev-parse HEAD^{tree}).Trim()
          node scripts/verify-windows-installed-acceptance-evidence.mjs --evidence tmp/windows-installed-acceptance/evidence.json --producer-result tmp/windows-installed-acceptance/frozen/producer-result.json --output tmp/windows-installed-acceptance/gate-result.json --architecture '${{ inputs.architecture }}' --source-commit $env:ACCEPTANCE_SOURCE_REVISION --source-tree $tree --bundle-sha256 $env:ACCEPTANCE_BUNDLE_SHA256 --manifest-sha256 $env:ACCEPTANCE_MANIFEST_SHA256 --authorization-sha256 $env:ACCEPTANCE_BUNDLE_AUTHORIZATION_SHA256 --producer-artifact-set-identity $env:ACCEPTANCE_PRODUCER_ARTIFACT_SET_IDENTITY --run-id '${{ github.run_id }}'
      - name: Upload exact acceptance gate result
        uses: actions/upload-artifact@b7c566a772e6b6fb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ inputs.architecture }}-installed-acceptance-gate
          path: |
            tmp/windows-installed-acceptance/evidence.json
            tmp/windows-installed-acceptance/gate-result.json
            tmp/windows-installed-acceptance/frozen/producer-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload partial diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6fb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ inputs.architecture }}-installed-acceptance-evidence
          path: |
            tmp/windows-installed-acceptance/diagnostics/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Retire protected native execution directory
        if: always()
        shell: pwsh
        run: |
          $descriptor = if ([string]::IsNullOrWhiteSpace($env:TQ_ACCEPTANCE_NATIVE_CLEANUP_DESCRIPTOR)) { 'tmp/windows-installed-acceptance/native-publication-cleanup.json' } else { $env:TQ_ACCEPTANCE_NATIVE_CLEANUP_DESCRIPTOR }
          if (Test-Path -LiteralPath $descriptor) {
            node scripts/windows-installed-acceptance-native-publication.mjs cleanup --descriptor $descriptor
          }
