name: Windows installed acceptance gate

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native acceptance host architecture
        required: true
        type: choice
        options: [x64]
      acceptance_bundle_url:
        description: HTTPS URL for the frozen acceptance evidence bundle
        required: true
        type: string
      acceptance_bundle_sha256:
        description: Exact SHA-256 of the frozen acceptance evidence bundle
        required: true
        type: string
      acceptance_bundle_authorization:
        description: Canonical signed authorization for this exact URL, digest, architecture, and time window
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-installed-acceptance-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  installed-acceptance:
    name: Staffed native Windows ${{ inputs.architecture }} acceptance
    runs-on:
      - self-hosted
      - Windows
      - interactive
      - talking-quill-acceptance
      - ${{ inputs.architecture }}
    timeout-minutes: 90
    environment: acceptance-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      - name: Authenticate and extract frozen acceptance inputs
        shell: pwsh
        env:
          ACCEPTANCE_BUNDLE_URL: ${{ inputs.acceptance_bundle_url }}
          ACCEPTANCE_BUNDLE_SHA256: ${{ inputs.acceptance_bundle_sha256 }}
          ACCEPTANCE_BUNDLE_AUTHORIZATION: ${{ inputs.acceptance_bundle_authorization }}
          ACCEPTANCE_BUNDLE_PUBLIC_KEY_SPKI_BASE64URL: ${{ vars.TALKING_QUILL_ACCEPTANCE_BUNDLE_PUBLIC_KEY_SPKI_BASE64URL }}
          ACCEPTANCE_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          if (-not $env:ACCEPTANCE_BUNDLE_URL.StartsWith('https://')) { throw 'Acceptance bundle URL must use HTTPS.' }
          if ($env:ACCEPTANCE_BUNDLE_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Acceptance bundle SHA-256 is invalid.' }
          node scripts/verify-windows-acceptance-authorization.mjs
          $sourceRevision = node -e "const e=JSON.parse(Buffer.from(process.env.ACCEPTANCE_BUNDLE_AUTHORIZATION,'base64url')); process.stdout.write(e.payload.sourceRevision)"
          if ($sourceRevision -cnotmatch '^[0-9a-f]{40}$') { throw 'Signed acceptance source revision is invalid.' }
          if ($sourceRevision -cne '${{ github.sha }}') { throw 'Signed acceptance source must equal the protected workflow run head.' }
          git checkout --detach $sourceRevision
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne $sourceRevision) { throw 'Runner checkout does not match the signed tooling source revision.' }
          node scripts/release-audit.mjs
          node scripts/reference-independence.mjs
          node scripts/windows-recovery-lineage.mjs
          $env:ACCEPTANCE_SOURCE_REVISION = $head
          "ACCEPTANCE_SOURCE_REVISION=$head" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node scripts/verify-windows-acceptance-authorization.mjs
          New-Item -ItemType Directory -Force tmp/windows-installed-acceptance | Out-Null
          $bundle = (Resolve-Path tmp/windows-installed-acceptance).Path + '\frozen-acceptance.zip'
          Invoke-WebRequest -Uri $env:ACCEPTANCE_BUNDLE_URL -OutFile $bundle
          $actual = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:ACCEPTANCE_BUNDLE_SHA256) { throw 'Acceptance bundle SHA-256 mismatch.' }
          $extraction = node scripts/windows-installed-acceptance-bundle.mjs extract $bundle tmp/windows-installed-acceptance/frozen $env:ACCEPTANCE_ARCHITECTURE - - $env:ACCEPTANCE_BUNDLE_SHA256 | ConvertFrom-Json
          $sourceNative = (Resolve-Path tmp/windows-installed-acceptance/frozen/acceptance/native).Path
          $nativeBase = Join-Path $env:ProgramData 'Talking Quill Acceptance Native'
          $native = Join-Path $nativeBase '${{ github.run_id }}'
          New-Item -ItemType Directory -Force $native | Out-Null
          Copy-Item -Path (Join-Path $sourceNative '*') -Destination $native -Force
          $sid = ([Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          & icacls.exe $nativeBase /inheritance:r /setowner '*S-1-5-32-544' /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' "*$sid`:(OI)(CI)RX" /T /C | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Extracted acceptance native directory could not be protected.' }
          $acl = Get-Acl -LiteralPath $native
          $owner = ([Security.Principal.NTAccount]$acl.Owner).Translate([Security.Principal.SecurityIdentifier]).Value
          $links = @(Get-ChildItem -LiteralPath $native -Force | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 })
          if (-not $acl.AreAccessRulesProtected -or $owner -cne 'S-1-5-32-544' -or $links.Count -ne 0) { throw 'Extracted acceptance native ACL or topology is not exact.' }
          foreach ($name in @('acceptance-broker.exe','acceptance-bootstrap.exe','trusted-launcher.exe','synthetic-sender.exe')) {
            $sourceFile = Join-Path $sourceNative $name
            $publishedFile = Join-Path $native $name
            if ((Get-FileHash -LiteralPath $sourceFile -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $publishedFile -Algorithm SHA256).Hash) { throw "Protected native publication differs: $name" }
          }
          "ACCEPTANCE_MANIFEST_SHA256=$($extraction.manifestSha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACCEPTANCE_BUNDLE_SHA256=$env:ACCEPTANCE_BUNDLE_SHA256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TQ_ACCEPTANCE_PROTECTED_NATIVE_ROOT=$native" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $evidenceInput = Get-Content -Raw -LiteralPath tmp/windows-installed-acceptance/frozen/evidence-input.json | ConvertFrom-Json
          $env:ACCEPTANCE_MANIFEST_PUBLIC_KEY_SPKI_BASE64URL = [string]$evidenceInput.acceptance.manifestPublicKeySpkiBase64url
          node scripts/verify-windows-acceptance-authorization.mjs
      - name: Execute installed acceptance matrix
        shell: pwsh
        run: |
          node scripts/windows-installed-acceptance-bundle.mjs verify-tree tmp/windows-installed-acceptance/frozen '${{ inputs.architecture }}' - - - $env:ACCEPTANCE_MANIFEST_SHA256
          node scripts/windows-installed-acceptance.mjs --bundle-root tmp/windows-installed-acceptance/frozen --evidence tmp/windows-installed-acceptance/frozen/evidence-input.json --output tmp/windows-installed-acceptance/evidence.json --execute
      - name: Run the non-mocked protected producer E2E
        shell: pwsh
        env:
          E2E_REQUEST_KEY: ${{ secrets.TALKING_QUILL_ACCEPTANCE_REQUEST_KEY_PKCS8_BASE64 }}
          E2E_MANIFEST_KEY: ${{ secrets.TALKING_QUILL_ACCEPTANCE_MANIFEST_KEY_PKCS8_BASE64 }}
          E2E_UPDATE_KEY: ${{ secrets.TALKING_QUILL_WINDOWS_UPDATE_KEY_PKCS8_BASE64 }}
          E2E_VALIDATION_KEY: ${{ secrets.TALKING_QUILL_ACCEPTANCE_VALIDATION_KEY_PKCS8_BASE64 }}
        run: |
          $keyRoot = New-Item -ItemType Directory -Force tmp/windows-installed-acceptance/e2e-keys
          foreach ($item in @(@('request',$env:E2E_REQUEST_KEY),@('manifest',$env:E2E_MANIFEST_KEY),@('update',$env:E2E_UPDATE_KEY),@('validation',$env:E2E_VALIDATION_KEY))) {
            if ([string]::IsNullOrWhiteSpace($item[1])) { throw "Protected producer key is missing: $($item[0])" }
            [IO.File]::WriteAllBytes((Join-Path $keyRoot "$($item[0]).der"),[Convert]::FromBase64String($item[1]))
          }
          $release = (Resolve-Path tmp/windows-installed-acceptance/frozen/imported/RELEASE.json).Path
          $provenance = (Resolve-Path tmp/windows-installed-acceptance/frozen/imported/artifact-provenance.json).Path
          $env:TQ_ACCEPTANCE_E2E_RELEASE=$release
          $env:TQ_ACCEPTANCE_E2E_RELEASE_SHA256=(Get-FileHash $release -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:TQ_ACCEPTANCE_E2E_PROVENANCE=$provenance
          $env:TQ_ACCEPTANCE_E2E_PROVENANCE_SHA256=(Get-FileHash $provenance -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:TQ_ACCEPTANCE_E2E_REQUEST_KEY=(Join-Path $keyRoot 'request.der')
          $env:TQ_ACCEPTANCE_E2E_MANIFEST_KEY=(Join-Path $keyRoot 'manifest.der')
          $env:TQ_ACCEPTANCE_E2E_UPDATE_KEY=(Join-Path $keyRoot 'update.der')
          $env:TQ_ACCEPTANCE_E2E_VALIDATION_KEY=(Join-Path $keyRoot 'validation.der')
          node scripts/run-windows-installed-acceptance-build-e2e.mjs | Tee-Object -FilePath tmp/windows-installed-acceptance/producer-e2e-result.json
          Remove-Item -LiteralPath $keyRoot -Recurse -Force
      - name: Verify and record exact installed acceptance result
        shell: pwsh
        run: |
          $tree = (git rev-parse HEAD^{tree}).Trim()
          node scripts/verify-windows-installed-acceptance-evidence.mjs --evidence tmp/windows-installed-acceptance/evidence.json --producer-result tmp/windows-installed-acceptance/producer-e2e-result.json --output tmp/windows-installed-acceptance/gate-result.json --architecture '${{ inputs.architecture }}' --source-commit $env:ACCEPTANCE_SOURCE_REVISION --source-tree $tree --bundle-sha256 $env:ACCEPTANCE_BUNDLE_SHA256 --run-id '${{ github.run_id }}'
      - name: Upload exact acceptance gate result
        uses: actions/upload-artifact@b7c566a772e6b6fb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ inputs.architecture }}-installed-acceptance-gate
          path: |
            tmp/windows-installed-acceptance/evidence.json
            tmp/windows-installed-acceptance/gate-result.json
            tmp/windows-installed-acceptance/producer-e2e-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload partial diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6fb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ inputs.architecture }}-installed-acceptance-evidence
          path: |
            tmp/windows-installed-acceptance/diagnostics/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Retire protected native execution directory
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:TQ_ACCEPTANCE_PROTECTED_NATIVE_ROOT) -and (Test-Path -LiteralPath $env:TQ_ACCEPTANCE_PROTECTED_NATIVE_ROOT)) {
            Remove-Item -LiteralPath $env:TQ_ACCEPTANCE_PROTECTED_NATIVE_ROOT -Recurse -Force
          }
