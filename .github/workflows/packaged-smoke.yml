name: Unsigned packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
            packageRoot: release/win-unpacked
            artifactRequirement: nsis
          - os: windows-11-arm
            target: win
            arch: arm64
            packageRoot: release/win-arm64-unpacked
            artifactRequirement: nsis
          - os: macos-15-intel
            target: mac
            arch: x64
            packageRoot: release/mac
            artifactRequirement: dmg-zip
          - os: macos-15
            target: mac
            arch: arm64
            packageRoot: release/mac-arm64
            artifactRequirement: dmg-zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            helper/target
          key: rust-packaged-smoke-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('helper/Cargo.lock') }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fetch-targets
      - run: node scripts/ensure-cargo-audit.mjs
      - name: Reusable release-consumable security gate
        run: pnpm security:gate
      - run: pnpm release:audit
      - run: pnpm dead-code
      - run: pnpm notices:check
      - run: pnpm model-manifest:check
      - run: pnpm build
      - name: Build native helper
        run: pnpm build:helper -- --platform ${{ matrix.target }} --arch ${{ matrix.arch }}
      - name: Probe native helper protocol
        run: pnpm test:helper:harness
      - name: Verify generated Windows uninstall policy
        if: matrix.target == 'win'
        run: node scripts/nsis-uninstall-policy.mjs
      - name: Package Windows
        if: matrix.target == 'win'
        working-directory: app
        run: pnpm exec electron-builder --config ../build/electron-builder.yml --win nsis --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package macOS
        if: matrix.target == 'mac'
        working-directory: app
        run: pnpm exec electron-builder --config ../build/electron-builder.yml --mac dmg zip --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Inspect package
        id: inspect-package
        run: pnpm package:inspect -- ${{ matrix.packageRoot }}
        env:
          TALKING_QUILL_PACKAGE_INSPECTION_STRICT: '1'
          TALKING_QUILL_PACKAGE_ARTIFACTS_REQUIRED: ${{ matrix.artifactRequirement }}
          TALKING_QUILL_PACKAGE_TARGET: ${{ matrix.target }}
          TALKING_QUILL_PACKAGE_ARCH: ${{ matrix.arch }}
      - name: Provision owned pinned npm Pi fixture
        if: matrix.target == 'win' && matrix.arch == 'x64'
        run: node scripts/prepare-pi-fixture.mjs install
      - name: Run packaged smoke with required Pi evidence
        if: matrix.target == 'win' && matrix.arch == 'x64'
        run: pnpm test:packaged
        env:
          TALKING_QUILL_PACKAGE_ROOT: ${{ matrix.packageRoot }}
          TALKING_QUILL_PACKAGE_TARGET: ${{ matrix.target }}
          TALKING_QUILL_REAL_NPM_PI_PREFIX: ${{ github.workspace }}\\tmp\\tests\\pi-npm\\prefix
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Run packaged smoke
        if: matrix.target != 'win' || matrix.arch != 'x64'
        run: pnpm test:packaged
        env:
          TALKING_QUILL_PACKAGE_ROOT: ${{ matrix.packageRoot }}
          TALKING_QUILL_PACKAGE_TARGET: ${{ matrix.target }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Clean owned Pi fixture
        if: always() && matrix.target == 'win' && matrix.arch == 'x64'
        run: node scripts/prepare-pi-fixture.mjs cleanup
      - name: Verify inspected artifact provenance immediately before upload
        run: pnpm artifact-provenance:verify
        env:
          TALKING_QUILL_PACKAGE_ROOT: ${{ matrix.packageRoot }}
          TALKING_QUILL_PACKAGE_TARGET: ${{ matrix.target }}
          TALKING_QUILL_PACKAGE_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: talking-quill-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ steps.inspect-package.outputs.artifact_paths }}
          if-no-files-found: error
