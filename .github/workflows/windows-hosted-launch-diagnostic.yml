name: Diagnose hosted Windows production setup launch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Runtime integrity/lifecycle or optional real installation token diagnostic
        required: true
        default: runtime
        type: choice
        options: [runtime, installation]
      producer_run_id:
        description: Canonical release-unsigned producer run containing both exact native setup artifacts
        required: true
        default: '34013671889'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    if: github.repository == 'gee666/talking-quill' && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            unpacked: win-unpacked
          - arch: arm64
            runner: windows-11-arm
            unpacked: win-arm64-unpacked
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate canonical producer before downloading executable artifacts
        id: producer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PRODUCER_RUN_ID -cnotmatch '^[1-9][0-9]*$') { throw 'Invalid producer run id.' }
          New-Item -ItemType Directory -Force tmp/hosted-smoke-${{ matrix.arch }} | Out-Null
          $json = & gh api "repos/gee666/talking-quill/actions/runs/$env:PRODUCER_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot authenticate producer run.' }
          $run = $json | ConvertFrom-Json
          if ($run.repository.full_name -cne 'gee666/talking-quill' -or $run.head_repository.full_name -cne 'gee666/talking-quill' -or $run.path -cne '.github/workflows/release-unsigned.yml' -or $run.event -cne 'workflow_dispatch' -or $run.head_branch -cne 'master' -or $run.status -cne 'completed' -or $run.head_sha -cnotmatch '^[0-9a-f]{40}$' -or [string]$run.id -cne $env:PRODUCER_RUN_ID) { throw 'Not a completed canonical default-branch release producer.' }
          # A failed smoke is expected. Do not require a successful overall producer conclusion.
          $json | Set-Content tmp/hosted-smoke-${{ matrix.arch }}/producer-run.json
          "commit=$($run.head_sha)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: gee666/talking-quill
          run-id: ${{ inputs.producer_run_id }}
          github-token: ${{ github.token }}
          name: windows-${{ matrix.arch }}-exact-native-setup-input
          path: tmp/hosted-diagnostic-input
      - name: Exercise selected native diagnostic on exact producer bytes without rebuilding
        shell: pwsh
        env:
          PRODUCER_COMMIT: ${{ steps.producer.outputs.commit }}
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $base = 'tmp/hosted-diagnostic-input/tmp/release-upload'
            $provenance = "$base/provenance-win-${{ matrix.arch }}-setup.json"
            $manifest = Get-Content -Raw $provenance | ConvertFrom-Json
            if ($manifest.sourceCommit -cne $env:PRODUCER_COMMIT) { throw 'Artifact provenance differs from authenticated producer commit.' }
            $installers = @(Get-ChildItem "$base/Talking-Quill-*-win-${{ matrix.arch }}-setup.exe")
            if ($installers.Count -ne 1) { throw 'Expected one exact production installer.' }
            if ($env:DIAGNOSTIC_MODE -ceq 'runtime') {
              node scripts/windows-hosted-runtime-smoke.mjs ${{ matrix.arch }} $installers[0].FullName $provenance tmp/hosted-diagnostic-input/release/${{ matrix.unpacked }} tmp/hosted-smoke-${{ matrix.arch }}
              if ($LASTEXITCODE -ne 0) { throw 'Exact native runtime diagnostic failed.' }
            } elseif ($env:DIAGNOSTIC_MODE -ceq 'installation') {
              ./scripts/windows-hosted-lifecycle-smoke.ps1 -Architecture ${{ matrix.arch }} -Installer $installers[0].FullName -Provenance $provenance -OutputDirectory tmp/hosted-smoke-${{ matrix.arch }}
            } else { throw 'Unknown diagnostic mode.' }
          } catch {
            $_ | Out-String | Set-Content tmp/hosted-smoke-${{ matrix.arch }}/workflow-failure.txt
            throw
          }
      - name: Preserve diagnostic logs, never publish release or promotion artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-${{ matrix.arch }}-hosted-launch-diagnostic
          path: tmp/hosted-smoke-${{ matrix.arch }}/**
          if-no-files-found: warn
          retention-days: 14
