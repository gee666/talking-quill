[package]
name = "talking-quill-helper"
version = "1.0.2"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT"
description = "Native keyboard and paste helper for Talking Quill"

[dependencies]
crossbeam-channel = "=0.5.16"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["raw_value"] }
thiserror = "=2.0.19"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
proptest = "=1.11.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
