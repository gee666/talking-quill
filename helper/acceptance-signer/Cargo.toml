[package]
name = "talking-quill-acceptance-signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Narrow deterministic signer for nonpromotable installed-acceptance kits"
build = "build.rs"

[package.metadata.talking-quill-boundary]
role = "acceptance-signer"
runtime = false
executable = true
private-key-reader = true

[[bin]]
name = "talking-quill-acceptance-synthetic-sender"
path = "src/synthetic_sender.rs"

[[bin]]
name = "talking-quill-windows-acceptance-broker"
path = "src/broker_main.rs"

[[bin]]
name = "talking-quill-update-key-tool"
path = "src/key_tool.rs"

[dependencies]
getrandom.workspace = true
p256 = { workspace = true, features = ["pkcs8"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
talking-quill-windows-owner-ipc = { path = "../windows-owner-ipc" }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[lints]
workspace = true
