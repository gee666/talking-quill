x64:
  firstOrDefaultFilePatterns:
    - '!**/node_modules/**'
    - node_modules/onnxruntime-node/bin/napi-v3/win32/x64/**/*
    - package.json
    - '!**/*.{iml,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,suo,xproj,cc,d.ts,mk,a,o,obj,forge-meta,pdb}'
    - '!**/._*'
    - '!**/electron-builder.{yaml,yml,json,json5,toml,ts}'
    - '!**/{.git,.hg,.svn,CVS,RCS,SCCS,__pycache__,.DS_Store,thumbs.db,.gitignore,.gitkeep,.gitattributes,.npmignore,.idea,.vs,.flowconfig,.jshintrc,.eslintrc,.circleci,.yarn-integrity,.yarn-metadata.json,yarn-error.log,yarn.lock,package-lock.json,npm-debug.log,pnpm-lock.yaml,bun.lock,bun.lockb,appveyor.yml,.travis.yml,circle.yml,.nyc_output,.husky,.github,electron-builder.env}'
    - '!.yarn{,/**/*}'
    - '!.editorconfig'
    - '!.yarnrc.yml'
  nodeModuleFilePatterns:
    - '**/*'
    - out/main/index.js
    - out/workers/whisper-bootstrap.cjs
    - out/workers/whisper-payload.cjs
    - out/preload/main.js
    - out/preload/widget.js
    - out/preload/capture.js
    - out/renderer/main/index.html
    - out/renderer/widget/index.html
    - out/renderer/capture/index.html
    - out/renderer/assets/*.js
    - out/renderer/assets/*.css
    - out/renderer/assets/*.png
    - out/renderer/assets/*.jpeg
    - package.json
    - '!node_modules/**/*'
    - node_modules/better-sqlite3/package.json
    - node_modules/better-sqlite3/LICENSE
    - node_modules/better-sqlite3/lib/index.js
    - node_modules/better-sqlite3/lib/database.js
    - node_modules/better-sqlite3/lib/sqlite-error.js
    - node_modules/better-sqlite3/lib/util.js
    - node_modules/better-sqlite3/lib/methods/aggregate.js
    - node_modules/better-sqlite3/lib/methods/backup.js
    - node_modules/better-sqlite3/lib/methods/function.js
    - node_modules/better-sqlite3/lib/methods/inspect.js
    - node_modules/better-sqlite3/lib/methods/pragma.js
    - node_modules/better-sqlite3/lib/methods/serialize.js
    - node_modules/better-sqlite3/lib/methods/table.js
    - node_modules/better-sqlite3/lib/methods/transaction.js
    - node_modules/better-sqlite3/lib/methods/wrappers.js
    - node_modules/better-sqlite3/build/Release/better_sqlite3.node
    - node_modules/bindings/package.json
    - node_modules/bindings/LICENSE.md
    - node_modules/bindings/bindings.js
    - node_modules/file-uri-to-path/package.json
    - node_modules/file-uri-to-path/LICENSE
    - node_modules/file-uri-to-path/index.js
    - node_modules/onnxruntime-node/package.json
    - node_modules/onnxruntime-node/dist/*.js
    - '!node_modules/onnxruntime-node/bin/napi-v3/**/*'
    - node_modules/onnxruntime-common/package.json
    - node_modules/onnxruntime-common/dist/cjs/package.json
    - node_modules/onnxruntime-common/dist/cjs/*.js
