packages:
  - app

overrides:
  '@huggingface/transformers>sharp': 0.35.3

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: true
  '@swc/core': true
  onnxruntime-node: true
  protobufjs: false
  sharp: true

minimumReleaseAgeExclude:
