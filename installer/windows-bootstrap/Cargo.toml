[package]
name = "talking-quill-windows-bootstrap"
version = "0.0.69"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT"

[workspace]

[target.'cfg(windows)'.dependencies]
getrandom = "=0.4.3"
sha2 = "=0.11.0"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
