[package]
name = "talking-quill-windows-setup"
version = "0.0.69"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT"

[workspace]

[features]
acceptance-faults = []
stale-schema2-cleanup = []
# Test/process harnesses only. Production builds must never enable this feature.
machine-lock-test-namespace = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.19"
sha2 = "=0.11.0"
sha2_10 = { package = "sha2", version = "=0.10.9" }
hmac = "=0.12.1"
p256 = { version = "=0.13.2", features = ["ecdh", "ecdsa"] }
zstd = "=0.13.3"

[target.'cfg(windows)'.dependencies]
getrandom = "=0.4.3"
windows = { version = "=0.61.3", features = ["Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole"] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
